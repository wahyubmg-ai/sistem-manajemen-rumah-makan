<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoOS — Sistem Manajemen Rumah Makan Terintegrasi & BI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f1f5f9; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const formatRupiah = (num) => {
      if (num === undefined || num === null || isNaN(num)) return 'Rp 0';
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    };

    const getWhatsAppLink = (phone, text) => {
      if (!phone) return '#';
      let formatted = phone.replace(/\D/g, '');
      if (formatted.startsWith('0')) formatted = '62' + formatted.slice(1);
      return `https://wa.me/${formatted}?text=${encodeURIComponent(text)}`;
    };

    const INITIAL_ORDERS = [
      { id: 'ORD-20260805-001', customerName: 'Bpk. Hendra Wijaya', customerPhone: '081234567890', orderType: 'Catering', status: 'Diproses', totalAmount: 1287500 },
      { id: 'ORD-20260805-002', customerName: 'Sdri. Maya Indah', customerPhone: '087811223344', orderType: 'Dine-in', status: 'Selesai', totalAmount: 70400 }
    ];

    const INITIAL_INVOICES = [
      { id: 'INV-20260805-001', customerName: 'Bpk. Hendra Wijaya', customerPhone: '081234567890', totalAmount: 1287500, remainingAmount: 787500, status: 'Sebagian Dibayar' },
      { id: 'INV-20260801-004', customerName: 'PT Sinergi Mandiri', customerPhone: '085678901234', totalAmount: 5650000, remainingAmount: 5650000, status: 'Jatuh Tempo' }
    ];

    function App() {
      const [role, setRole] = useState('owner');
      const [tab, setTab] = useState('dashboard');
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [invoices, setInvoices] = useState(INITIAL_INVOICES);

      return (
        <div className="min-h-screen flex flex-col">
          <header className="px-6 py-4 border-b border-slate-800 bg-slate-950 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-2xl">🍱</span>
              <div>
                <h1 className="font-bold text-lg text-white">RestoOS — Sistem Rumah Makan</h1>
                <p className="text-xs text-slate-400">Integrated Operations & BI Platform</p>
              </div>
            </div>
            <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
              <span className="text-slate-400">Role:</span>
              <select value={role} onChange={(e) => setRole(e.target.value)} className="bg-transparent text-emerald-400 font-bold focus:outline-none">
                <option value="owner">👑 Owner</option>
                <option value="manager">🛡️ Manager</option>
                <option value="admin">📝 Admin</option>
                <option value="kasir">💳 Kasir</option>
                <option value="karyawan">👤 Karyawan</option>
              </select>
            </div>
          </header>

          <div className="flex-1 flex flex-col md:flex-row">
            <aside className="w-full md:w-64 bg-slate-950 border-r border-slate-800 p-4 space-y-2">
              <button onClick={() => setTab('dashboard')} className={`w-full text-left p-3 rounded-xl text-xs font-bold ${tab === 'dashboard' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'}`}>📊 Dashboard BI</button>
              <button onClick={() => setTab('orders')} className={`w-full text-left p-3 rounded-xl text-xs font-bold ${tab === 'orders' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'}`}>🛒 Order Management</button>
              <button onClick={() => setTab('invoices')} className={`w-full text-left p-3 rounded-xl text-xs font-bold ${tab === 'invoices' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'}`}>📄 Invoice & Billing</button>
            </aside>

            <main className="flex-1 p-6 space-y-6">
              {tab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="p-6 rounded-3xl bg-gradient-to-r from-emerald-950 to-slate-900 border border-emerald-500/30">
                    <h2 className="text-xl font-bold text-white">BI Operations Dashboard</h2>
                    <p className="text-xs text-slate-400 mt-1">Real-time status rumah makan & keuangan</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="p-5 rounded-2xl glass-card">
                      <div className="text-xs text-slate-400 font-semibold">Penjualan Hari Ini</div>
                      <div className="text-2xl font-bold text-white mt-2">{formatRupiah(3250000)}</div>
                    </div>
                    <div className="p-5 rounded-2xl glass-card">
                      <div className="text-xs text-slate-400 font-semibold">Order Aktif</div>
                      <div className="text-2xl font-bold text-cyan-300 mt-2">{orders.length} Order</div>
                    </div>
                    <div className="p-5 rounded-2xl glass-card">
                      <div className="text-xs text-slate-400 font-semibold">Tagihan Belum Lunas</div>
                      <div className="text-2xl font-bold text-rose-300 mt-2">{formatRupiah(invoices.reduce((s, i) => s + i.remainingAmount, 0))}</div>
                    </div>
                  </div>
                </div>
              )}

              {tab === 'orders' && (
                <div className="space-y-4">
                  <h2 className="text-xl font-bold text-white">Order Management</h2>
                  <div className="rounded-3xl glass-card overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="bg-slate-900 text-slate-400 border-b border-slate-800">
                          <th className="p-4">No. Order</th>
                          <th className="p-4">Pelanggan</th>
                          <th className="p-4">Tipe</th>
                          <th className="p-4">Total</th>
                          <th className="p-4">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {orders.map(o => (
                          <tr key={o.id}>
                            <td className="p-4 font-bold text-white">{o.id}</td>
                            <td className="p-4 text-slate-300">{o.customerName}</td>
                            <td className="p-4 text-amber-300 font-semibold">{o.orderType}</td>
                            <td className="p-4 font-bold text-emerald-400">{formatRupiah(o.totalAmount)}</td>
                            <td className="p-4 font-bold text-emerald-300">{o.status}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {tab === 'invoices' && (
                <div className="space-y-4">
                  <h2 className="text-xl font-bold text-white">Invoice System</h2>
                  <div className="rounded-3xl glass-card overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="bg-slate-900 text-slate-400 border-b border-slate-800">
                          <th className="p-4">No. Invoice</th>
                          <th className="p-4">Pelanggan</th>
                          <th className="p-4">Total Tagihan</th>
                          <th className="p-4">Sisa Tagihan</th>
                          <th className="p-4 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {invoices.map(i => (
                          <tr key={i.id}>
                            <td className="p-4 font-bold text-white">{i.id}</td>
                            <td className="p-4 text-slate-300">{i.customerName}</td>
                            <td className="p-4 font-bold text-white">{formatRupiah(i.totalAmount)}</td>
                            <td className="p-4 font-bold text-rose-400">{formatRupiah(i.remainingAmount)}</td>
                            <td className="p-4 text-right">
                              <a href={getWhatsAppLink(i.customerPhone, `Halo Kak ${i.customerName}, berikut invoice ${i.id}`)} target="_blank" className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold text-[11px]">Kirim WA</a>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
