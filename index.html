    const calculateDistanceMeters = (lat1, lon1, lat2, lon2) => {
      const R = 6371e3;
      const φ1 = (lat1 * Math.PI) / 180;
      const φ2 = (lat2 * Math.PI) / 180;
      const Δφ = ((lat2 - lat1) * Math.PI) / 180;
      const Δλ = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    };

                              </td>
                              <td className="p-4 text-right space-x-2">
                                <button onClick={() => setReceiptOrder(o)} className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-[11px]">
                                  Bon Dapur
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* Modul Invoice & Billing */}
              {activeTab === 'invoices' && (
                <div className="space-y-4">
                  <div>
                    <h2 className="text-xl font-extrabold text-white">Invoice & Billing System</h2>
                    <p className="text-xs text-slate-400">Penagihan otomatis & pengiriman via WhatsApp / PDF.</p>
                  </div>

                  <div className="rounded-3xl glass-card overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="bg-slate-900 text-slate-400 border-b border-slate-800 uppercase tracking-wider text-[10px]">
                            <th className="p-4">No. Invoice</th>
                            <th className="p-4">Pelanggan</th>
                            <th className="p-4">Total Tagihan</th>
                            <th className="p-4">Sisa Tagihan</th>
                            <th className="p-4">Status</th>
                            <th className="p-4 text-right">Aksi Penagihan</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {invoices.map(inv => {
                            const waUrl = getWhatsAppLink(inv.customerPhone, `Halo Kak ${inv.customerName}, berikut invoice ${inv.id} dari Resto Syukuran sebesar ${formatRupiah(inv.totalAmount)}. Terima kasih!`);

                            return (
                              <tr key={inv.id} className="hover:bg-slate-900/50">
                                <td className="p-4 font-extrabold text-white">{inv.id}</td>
                                <td className="p-4 font-bold text-slate-200">{inv.customerName}</td>
                                <td className="p-4 font-extrabold text-white">{formatRupiah(inv.totalAmount)}</td>
                                <td className="p-4 font-extrabold text-rose-400">{formatRupiah(inv.remainingAmount)}</td>
                                <td className="p-4">
                                  <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${inv.status === 'Lunas' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                    {inv.status}
                                  </span>
                                </td>
                                <td className="p-4 text-right space-x-2">
                                  <a href={waUrl} target="_blank" className="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px] shadow-lg shadow-emerald-600/30">
                                    Kirim WA
                                  </a>
                                  <button onClick={() => setActiveInvoice(inv)} className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-[11px]">
                                    Detail PDF
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* Modul Finance Tracker */}
              {activeTab === 'finance' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-extrabold text-white">Finance & Accounts Receivable (AR) Tracker</h2>
                      <p className="text-xs text-slate-400">Pemasukan, piutang, dan pengeluaran operasional.</p>
                    </div>
                    <button onClick={() => setIsExpenseModalOpen(true)} className="px-4 py-2 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs shadow-lg shadow-rose-500/25">
                      + Catat Pengeluaran
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="p-5 rounded-2xl glass-card">
                      <div className="text-xs text-slate-400 font-semibold">Total Pemasukan Kas</div>
                      <div className="text-2xl font-extrabold text-emerald-400 mt-2">{formatRupiah(13500000)}</div>
                    </div>
                    <div className="p-5 rounded-2xl glass-card">
                      <div className="text-xs text-slate-400 font-semibold">Total Pengeluaran</div>
                      <div className="text-2xl font-extrabold text-rose-400 mt-2">{formatRupiah(expenses.reduce((s, e) => s + e.amount, 0))}</div>
                    </div>
                    <div className="p-5 rounded-2xl glass-card bg-emerald-950/40 border-emerald-500/30">
                      <div className="text-xs text-emerald-300 font-bold">Estimasi Laba Bersih</div>
                      <div className="text-2xl font-extrabold text-white mt-2">{formatRupiah(13500000 - expenses.reduce((s, e) => s + e.amount, 0))}</div>
                    </div>
                  </div>
                </div>
              )}

              {/* Modul CRM */}
              {activeTab === 'crm' && (
                <div className="space-y-4">
                  <h2 className="text-xl font-extrabold text-white">Customer Follow-up & CRM</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {reminders.map(rem => (
                      <div key={rem.id} className="p-5 rounded-3xl glass-card space-y-3">
                        <div className="flex justify-between items-center">
                          <span className="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300">{rem.type}</span>
                          <span className="text-[10px] text-amber-400 font-bold">Pending Action</span>
                        </div>
                        <h4 className="text-sm font-bold text-white">{rem.title}</h4>
                        <div className="p-3 rounded-2xl bg-slate-950 text-xs">
                          <div className="font-bold text-white">{rem.customerName}</div>
                          <div className="text-rose-400 font-bold mt-1">Nominal: {formatRupiah(rem.amount)}</div>
                        </div>
                        <a href={getWhatsAppLink(rem.customerPhone, rem.waTemplate)} target="_blank" className="w-full block text-center py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow-lg shadow-emerald-600/30">
                          Kirim WA Follow-up
                        </a>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Modul Absensi Karyawan */}
              {activeTab === 'attendance' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-extrabold text-white">Absensi Foto Selfie & Geofencing GPS</h2>
                      <p className="text-xs text-slate-400">Verifikasi kehadiran visual + koordinat lokasi 100m.</p>
                    </div>
                    <button onClick={() => setIsCameraOpen(true)} className="px-5 py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 font-bold text-xs text-white shadow-lg shadow-emerald-500/25">
                      📸 Check-in Absen Masuk
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {attendance.map(att => (
                      <div key={att.id} className="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center gap-4">
                        <img src={att.photoUrl} alt={att.name} className="w-16 h-16 rounded-2xl object-cover border-2 border-emerald-500" />
                        <div>
                          <div className="font-bold text-sm text-white">{att.name}</div>
                          <div className="text-xs text-slate-400">{att.role}</div>
                          <div className="text-xs font-bold text-emerald-400 mt-1">{att.checkInTime} WIB ({att.status})</div>
                          <div className="text-[10px] text-cyan-300 mt-0.5">GPS Distance: {att.distanceMeters}m (Resto Radius)</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 p-4 rounded-2xl bg-slate-900 border border-emerald-500 text-emerald-300 text-xs font-bold shadow-2xl z-50 animate-bounce">
              <div>{toast.title}</div>
              <div className="text-slate-300 font-normal mt-0.5">{toast.message}</div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
