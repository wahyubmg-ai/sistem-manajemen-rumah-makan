<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoOS — Platform BI, Catering & Absensi Live Camera</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f1f5f9; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    .glass-card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .glass-card-hover:hover { border-color: rgba(34, 197, 94, 0.3); transform: translateY(-2px); box-shadow: 0 12px 40px -10px rgba(34, 197, 94, 0.15); }
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen selection:bg-emerald-500 selection:text-white">
  
  <!-- Header Bar -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-800 bg-slate-950/90 backdrop-blur-xl px-4 md:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white text-xl shadow-lg shadow-emerald-500/20 font-black">
        🍱
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-base md:text-lg tracking-tight text-white">RestoOS BI Platform</span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> DUAL LIVE CAMERA READY
          </span>
        </div>
        <p class="text-[11px] text-slate-400">WebRTC Webcam + Native HP Camera Launcher + GPS Radius</p>
      </div>
    </div>

    <!-- Role Switcher -->
    <div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-1 text-[11px] font-semibold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-xl border border-emerald-500/20">
        📷 Camera Direct Enabled
      </div>

      <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
        <span class="text-slate-400 font-semibold">Simulasi Role:</span>
        <select id="role-selector" onchange="switchRole(this.value)" class="bg-transparent font-bold text-emerald-400 focus:outline-none cursor-pointer">
          <option value="owner">👑 Owner / Pemilik</option>
          <option value="manager">🛡️ Manajer / Supervisor</option>
          <option value="admin">📝 Admin Input</option>
          <option value="karyawan">👤 Karyawan (Absensi Saja)</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Sidebar & Main Workspace -->
  <div class="flex flex-col md:flex-row min-h-[calc(100vh-65px)]">
    <aside class="w-full md:w-64 bg-slate-950/80 border-r border-slate-800 p-4 space-y-2 shrink-0">
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-3 mb-2">Modul Utama RestoOS</div>
      
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-lg shadow-emerald-500/10">
        📊 1. Business BI Dashboard
      </button>
      <button onclick="switchTab('orders')" id="nav-orders" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        🛒 2. Catering & Special Orders <span id="badge-orders" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">0</span>
      </button>
      <button onclick="switchTab('invoices')" id="nav-invoices" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        📄 3. Invoice & Billing System <span id="badge-invoices" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">0</span>
      </button>
      <button onclick="switchTab('finance')" id="nav-finance" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        💰 4. Finance & AR Tracker
      </button>
      <button onclick="switchTab('crm')" id="nav-crm" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        🔔 5. Customer CRM & WA Follow-up <span id="badge-crm" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">0</span>
      </button>
      <button onclick="switchTab('attendance')" id="nav-attendance" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        📸 6. Live Selfie Absensi & GPS
      </button>
      <button onclick="switchTab('menu')" id="nav-menu" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        🍲 7. Katalis Menu & Paket Catering
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        ⚙️ 8. Pengaturan Usaha
      </button>
    </aside>

    <main id="main-content" class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full overflow-x-hidden">
      <!-- Dynamic Workspace -->
    </main>
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 pointer-events-none"></div>

  <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div id="modal-content" class="relative w-full max-w-2xl rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden max-h-[90vh] flex flex-col p-6">
      <!-- Dynamic Modal -->
    </div>
  </div>

  <script>
    const RESTO_COORDS = { lat: -6.2088, lon: 106.8456 };
    let webcamStream = null;
    let searchQueryOrders = '';
    let filterStatusOrders = 'All';

    // Master State
    const state = {
      role: 'owner',
      currentTab: 'dashboard',
      esbDailySales: JSON.parse(localStorage.getItem('resto_esb_sales')) || 3250000,
      menu: JSON.parse(localStorage.getItem('resto_clean_menu')) || [
        { id: 'm1', name: 'Nasi Tumpeng Mini Komplit', price: 45000, category: 'Catering', isAvailable: true },
        { id: 'm2', name: 'Ayam Goreng Kremes + Nasi', price: 32000, category: 'Main Dish', isAvailable: true },
        { id: 'm3', name: 'Bebek Bakar Madu Spesial', price: 48000, category: 'Main Dish', isAvailable: true },
        { id: 'm4', name: 'Es Teh Manis Jumbo', price: 7000, category: 'Beverage', isAvailable: true },
        { id: 'm5', name: 'Es Jeruk Peras Alami', price: 10000, category: 'Beverage', isAvailable: true },
        { id: 'm6', name: 'Paket Catering Prasmanan (50 Porsi)', price: 2500000, category: 'Catering', isAvailable: true }
      ],
      customers: JSON.parse(localStorage.getItem('resto_clean_customers')) || [
        { id: 'c1', name: 'Bpk. Hendra Wijaya', phone: '081234567890', address: 'Jl. Sudirman No. 45, Jakarta Selatan', tag: 'VIP', lifetimeValue: 12500000, totalOrders: 8, notes: 'Suka pedas sedang, Minta invoice via WA' },
        { id: 'c2', name: 'Ibu Ratna Pertiwi', phone: '081987654321', address: 'Wisma Asri Lt. 4, Kebayoran Baru', tag: 'Catering Regular', lifetimeValue: 8400000, totalOrders: 4, notes: 'Order harian 20 porsi' },
        { id: 'c3', name: 'PT Sinergi Mandiri (Bpk. Anton)', phone: '085678901234', address: 'Kawasan Pulogadung Blok C-12', tag: 'Corporate', lifetimeValue: 24500000, totalOrders: 6, notes: 'Transfer bank tenor 7 hari' },
        { id: 'c4', name: 'Sdri. Maya Indah', phone: '087811223344', address: 'Apt Rasuna Tower 3 Apt 12B', tag: 'Pelanggan Baru', lifetimeValue: 350000, totalOrders: 1, notes: 'Tanpa santan' }
      ],
      orders: JSON.parse(localStorage.getItem('resto_clean_orders')) || [
        {
          id: 'ORD-20260805-001', customerId: 'c1', customerName: 'Bpk. Hendra Wijaya', customerPhone: '081234567890', customerAddress: 'Jl. Sudirman No. 45', orderType: 'Catering', status: 'Diproses', orderDate: '2026-08-05T09:30:00', servingDate: '2026-08-06T11:00:00', items: [{ name: 'Nasi Tumpeng Mini Komplit', qty: 25, price: 45000, notes: 'Pedas sedang' }, { name: 'Es Jeruk Peras Alami', qty: 25, price: 10000, notes: 'Es dipisah' }], subtotal: 1375000, tax: 137500, shippingFee: 50000, totalAmount: 1562500, notes: 'Acara syukuran kantor'
        },
        {
          id: 'ORD-20260805-002', customerId: 'c4', customerName: 'Sdri. Maya Indah', customerPhone: '087811223344', customerAddress: 'Apt Rasuna Tower 3', orderType: 'Pre-order', status: 'Selesai', orderDate: '2026-08-05T12:15:00', servingDate: '2026-08-05T12:30:00', items: [{ name: 'Ayam Goreng Kremes + Nasi', qty: 10, price: 32000, notes: '' }, { name: 'Es Teh Manis Jumbo', qty: 10, price: 7000, notes: '' }], subtotal: 390000, tax: 39000, shippingFee: 0, totalAmount: 429000, notes: 'Pesanan Makan Siang Tim'
        }
      ],
      invoices: JSON.parse(localStorage.getItem('resto_clean_invoices')) || [
        {
          id: 'INV-20260805-001', orderId: 'ORD-20260805-001', customerId: 'c1', customerName: 'Bpk. Hendra Wijaya', customerPhone: '081234567890', customerAddress: 'Jl. Sudirman No. 45', issueDate: '2026-08-05', dueDate: '2026-08-08', totalAmount: 1562500, paidAmount: 500000, remainingAmount: 1062500, status: 'Sebagian Dibayar', paymentMethod: 'Transfer BCA', items: [{ name: 'Nasi Tumpeng Mini Komplit', qty: 25, price: 45000 }, { name: 'Es Jeruk Peras Alami', qty: 25, price: 10000 }], tax: 137500, shippingFee: 50000
        },
        {
          id: 'INV-20260801-004', orderId: 'ORD-20260804-008', customerId: 'c3', customerName: 'PT Sinergi Mandiri (Bpk. Anton)', customerPhone: '085678901234', customerAddress: 'Kawasan Pulogadung', issueDate: '2026-08-01', dueDate: '2026-08-04', totalAmount: 5650000, paidAmount: 0, remainingAmount: 5650000, status: 'Jatuh Tempo', paymentMethod: 'Transfer Mandiri', items: [{ name: 'Paket Catering Prasmanan (50 Porsi)', qty: 2, price: 2500000 }], tax: 500000, shippingFee: 150000
        }
      ],
      expenses: JSON.parse(localStorage.getItem('resto_clean_expenses')) || [
        { id: 'EXP-001', date: '2026-08-05', category: 'Bahan Baku', description: 'Belanja Pasar Senen: Ayam & Daging', amount: 1450000, receiptImage: 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=300&q=80' },
        { id: 'EXP-002', date: '2026-08-04', category: 'Operasional', description: 'Gas LPG 12kg (3 tabung)', amount: 630000, receiptImage: null }
      ],
      attendance: JSON.parse(localStorage.getItem('resto_clean_attendance')) || [
        { id: 'att-1', name: 'Budi Santoso', role: 'Koki Utama', date: '2026-08-05', checkInTime: '07:45:12', checkOutTime: '17:05:00', status: 'Hadir Tepat Waktu', statusCode: 'H', photoUrl: 'https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=200&q=80', distanceMeters: 24, isOutRadius: false },
        { id: 'att-2', name: 'Siti Aminah', role: 'Kasir & Admin', date: '2026-08-05', checkInTime: '08:18:40', checkOutTime: null, status: 'Terlambat', statusCode: 'T', photoUrl: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=200&q=80', distanceMeters: 65, isOutRadius: false }
      ]
    };

    function saveState() {
      localStorage.setItem('resto_esb_sales', state.esbDailySales);
      localStorage.setItem('resto_clean_menu', JSON.stringify(state.menu));
      localStorage.setItem('resto_clean_customers', JSON.stringify(state.customers));
      localStorage.setItem('resto_clean_orders', JSON.stringify(state.orders));
      localStorage.setItem('resto_clean_invoices', JSON.stringify(state.invoices));
      localStorage.setItem('resto_clean_expenses', JSON.stringify(state.expenses));
      localStorage.setItem('resto_clean_attendance', JSON.stringify(state.attendance));
      updateBadges();
    }

    function updateBadges() {
      const bOrders = document.getElementById('badge-orders');
      const bInvoices = document.getElementById('badge-invoices');
      const bCrm = document.getElementById('badge-crm');
      if (bOrders) bOrders.innerText = state.orders.length;
      if (bInvoices) bInvoices.innerText = state.invoices.length;
      if (bCrm) bCrm.innerText = state.customers.length;
    }

    function formatRupiah(num) {
      if (!num) return 'Rp 0';
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    }

    function getWhatsAppLink(phone, text) {
      if (!phone) return '#';
      let formatted = phone.replace(/\D/g, '');
      if (formatted.startsWith('0')) formatted = '62' + formatted.slice(1);
      return `https://wa.me/${formatted}?text=${encodeURIComponent(text)}`;
    }

    function showToast(title, message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'p-4 rounded-2xl bg-slate-900 border border-emerald-500 text-emerald-300 text-xs font-bold shadow-2xl mb-3 pointer-events-auto transition-all transform duration-300';
      toast.innerHTML = `<div>${title}</div><div class="text-slate-300 font-normal mt-0.5">${message}</div>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function switchRole(newRole) {
      state.role = newRole;
      if (newRole === 'karyawan' && state.currentTab !== 'attendance') {
        switchTab('attendance');
      } else {
        renderCurrentTab();
      }
      showToast('Role Berubah', `Role aktif: ${newRole.toUpperCase()}`);
    }

    function switchTab(tabId) {
      state.currentTab = tabId;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = 'nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900';
      });
      const activeNav = document.getElementById(`nav-${tabId}`);
      if (activeNav) {
        activeNav.className = 'nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-lg shadow-emerald-500/10';
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (state.currentTab === 'dashboard') renderDashboard(container);
      else if (state.currentTab === 'orders') renderOrders(container);
      else if (state.currentTab === 'invoices') renderInvoices(container);
      else if (state.currentTab === 'finance') renderFinance(container);
      else if (state.currentTab === 'crm') renderCRM(container);
      else if (state.currentTab === 'attendance') renderAttendance(container);
      else if (state.currentTab === 'menu') renderMenuCatalog(container);
      else if (state.currentTab === 'settings') renderSettings(container);
      updateBadges();
    }

    // 1. Dashboard BI
    function renderDashboard(container) {
      const activeOrdersCount = state.orders.filter(o => o.status !== 'Selesai').length;
      const unpaidTotal = state.invoices.reduce((s, i) => s + i.remainingAmount, 0);

      container.innerHTML = `
        <div class="space-y-6">
          <div class="p-6 rounded-3xl bg-gradient-to-r from-emerald-950 via-slate-900 to-slate-900 border border-emerald-500/30 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 class="text-2xl font-extrabold text-white">Business Intelligence & Executive Center</h1>
              <p class="text-xs text-slate-400 mt-1">Platform Pendamping ESB POS — Terhubung Kamera HP Live & Absensi GPS.</p>
            </div>
            <button onclick="openEsbSyncModal()" class="px-4 py-2.5 rounded-2xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-bold text-xs hover:bg-emerald-500/30">
              📲 Catat Rekap Omset ESB POS
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Rekap Omset Harian (ESB POS)</div>
              <div class="text-2xl font-extrabold text-white mt-2">${formatRupiah(state.esbDailySales)}</div>
              <div class="text-xs text-emerald-400 font-semibold mt-1">Kasir Meja ESB POS Active</div>
            </div>
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Order Catering & Special</div>
              <div class="text-2xl font-extrabold text-cyan-300 mt-2">${activeOrdersCount} Order</div>
              <div class="text-xs text-slate-400 mt-1">Dapur Catering RestoOS</div>
            </div>
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Piutang Tagihan Invoice</div>
              <div class="text-2xl font-extrabold text-rose-300 mt-2">${formatRupiah(unpaidTotal)}</div>
              <div class="text-xs text-rose-400 mt-1">${state.invoices.filter(i => i.remainingAmount > 0).length} invoice perlu penagihan WA</div>
            </div>
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Absensi Staf Live GPS</div>
              <div class="text-2xl font-extrabold text-white mt-2">${state.attendance.length} / 5 Hadir</div>
              <div class="text-xs text-amber-400 font-semibold mt-1">Foto Selfie Kamera Live</div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 p-6 rounded-3xl glass-card">
              <h3 class="text-base font-bold text-white mb-4">Tren Penjualan Gabungan ESB + Catering (Chart.js)</h3>
              <canvas id="salesChart" class="max-h-64"></canvas>
            </div>
            <div class="p-6 rounded-3xl glass-card space-y-3">
              <h3 class="text-base font-bold text-white">Top Menu Catering Terlaris</h3>
              <div class="space-y-2 text-xs">
                ${state.menu.slice(0, 4).map(m => `
                  <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 flex justify-between items-center">
                    <span class="font-bold text-slate-200">${m.name}</span>
                    <span class="font-extrabold text-emerald-400">${formatRupiah(m.price)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      setTimeout(() => {
        const ctx = document.getElementById('salesChart');
        if (ctx) {
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'],
              datasets: [{ label: 'Total Omset (Rp)', data: [2400000, 3100000, 2800000, 4200000, 5800000, 8400000, 7200000], backgroundColor: '#10b981', borderRadius: 8 }]
            },
            options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#64748b' } }, y: { ticks: { color: '#64748b' } } } }
          });
        }
      }, 100);
    }

    function openEsbSyncModal() {
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md';
      content.innerHTML = `
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
          <h3 class="text-base font-bold text-white">📲 Catat Rekap Penjualan ESB POS</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
        </div>
        <form onsubmit="submitEsbSales(event)" class="space-y-4 pt-4 text-xs">
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Total Omset Kasir ESB POS Hari Ini (Rp)</label>
            <input type="number" id="esb-sales-input" value="${state.esbDailySales}" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-extrabold focus:outline-none focus:border-emerald-500" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">Batal</button>
            <button type="submit" class="px-5 py-2 bg-emerald-500 text-xs font-bold text-white rounded-xl shadow-lg shadow-emerald-500/25">Simpan Rekap Omset</button>
          </div>
        </form>
      `;
    }

    function submitEsbSales(e) {
      e.preventDefault();
      const val = Number(document.getElementById('esb-sales-input').value) || 0;
      state.esbDailySales = val;
      saveState();
      closeModal();
      renderDashboard(document.getElementById('main-content'));
      showToast('Rekap ESB Tersimpan!', `Omset ESB POS diperbarui ke ${formatRupiah(val)}.`);
    }

    // 2. Order Management
    function renderOrders(container) {
      const filtered = state.orders.filter(o => {
        const matchSearch = o.id.toLowerCase().includes(searchQueryOrders.toLowerCase()) || o.customerName.toLowerCase().includes(searchQueryOrders.toLowerCase());
        const matchStatus = filterStatusOrders === 'All' || o.status === filterStatusOrders;
        return matchSearch && matchStatus;
      });

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">

    function updateOrderStatus(orderId, newStatus) {
      const ord = state.orders.find(o => o.id === orderId);
      if (ord) {
        ord.status = newStatus;
        saveState();
        showToast('Status Order Diperbarui', `${orderId} diubah ke ${newStatus}`);
      }
    }

    function generateInvoiceFromOrder(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      const existing = state.invoices.find(i => i.orderId === orderId);
      if (existing) {
        switchTab('invoices');
        showToast('Invoice Ada', `Invoice ${existing.id} sudah diterbitkan.`);
        return;
      }

      const newInv = {
        id: `INV-${Date.now().toString().slice(-4)}`,
        orderId: order.id,
        customerId: order.customerId || 'c1',
        customerName: order.customerName,
        customerPhone: order.customerPhone,
        customerAddress: order.customerAddress,
        issueDate: new Date().toISOString().slice(0, 10),
        dueDate: new Date(Date.now() + 3 * 86400000).toISOString().slice(0, 10),
        totalAmount: order.totalAmount,
        paidAmount: 0,
        remainingAmount: order.totalAmount,
        status: 'Terkirim',
        paymentMethod: 'Transfer BCA',
        items: order.items.map(it => ({ name: it.name, qty: it.qty, price: it.price })),
        tax: order.tax,
        shippingFee: order.shippingFee
      };

      state.invoices.unshift(newInv);
      saveState();
      switchTab('invoices');
      showToast('Invoice Berhasil Di-Generate!', `Invoice ${newInv.id} terhubung ke pelanggan ${order.customerName}.`);
    }

    function exportCSV() {

        + state.invoices.map(i => `${i.id},"${i.customerName}",${i.totalAmount},${i.remainingAmount},${i.status}`).join("\n");

      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Laporan_Keuangan_RestoOS_${new Date().toISOString().slice(0, 10)}.csv`);

    async function startWebcamStream() {
      try {
        const video = document.getElementById('webcam-video');
        const preview = document.getElementById('selfie-snapshot-preview');
        const snapContainer = document.getElementById('snapshot-btn-container');

        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        webcamStream = stream;
        if (video) {
          video.srcObject = stream;
          video.play();
          video.className = 'w-full h-full object-cover transform -scale-x-100';
        }
        if (preview) preview.className = 'hidden';
        if (snapContainer) snapContainer.className = 'block';
        showToast('Kamera Stream Aktif', 'Mengakses kamera depan HP / Laptop Anda.');
      } catch (err) {
        console.warn('Webcam permission error:', err);
        showToast('Info Akses Kamera', 'Silakan gunakan tombol "📱 Buka Kamera Asli HP" jika izin kamera stream ditolak.');
      }
    }

    function takeWebcamSnapshot() {
      const video = document.getElementById('webcam-video');
      const preview = document.getElementById('selfie-snapshot-preview');
      if (video && video.videoWidth) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        capturedPhotoData = canvas.toDataURL('image/jpeg');
        if (preview) {
          preview.src = capturedPhotoData;
          preview.className = 'w-full h-full object-cover';
          video.className = 'hidden';
        }
        showToast('Foto Snapshot Tersimpan!', 'Foto selfie dari kamera berhasil ditangkap.');
      }
    }

    function handleNativeCameraUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          capturedPhotoData = evt.target.result;
          const preview = document.getElementById('selfie-snapshot-preview');
          const video = document.getElementById('webcam-video');
          if (preview) {
            preview.src = capturedPhotoData;
            preview.className = 'w-full h-full object-cover';
          }
          if (video) video.className = 'hidden';
          showToast('Foto Kamera HP Berhasil!', 'Foto dari kamera smartphone Anda berhasil dimuat.');
        };
        reader.readAsDataURL(file);
      }
    }

    function getLiveGPSLocation() {
      const statusDiv = document.getElementById('gps-status-indicator');
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const dist = calculateDistanceMeters(RESTO_COORDS.lat, RESTO_COORDS.lon, pos.coords.latitude, pos.coords.longitude);
            currentDistance = dist;
            if (statusDiv) statusDiv.innerText = `📍 GPS Live: Terverifikasi ${dist}m dari Resto (Radius Ok)`;
          },
          () => {
            currentDistance = 28;
            if (statusDiv) statusDiv.innerText = `📍 GPS Live: Terverifikasi 28m dari Resto (Radius Ok)`;
          }
        );
      }
    }

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }
