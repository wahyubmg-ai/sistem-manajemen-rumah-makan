<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoOS — Sistem Manajemen Rumah Makan & BI Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f1f5f9; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen selection:bg-emerald-500 selection:text-white">
  
  <!-- Header Bar -->
  <header className="sticky top-0 z-40 w-full border-b border-slate-800 bg-slate-950/90 backdrop-blur-xl px-4 md:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
    <div className="flex items-center gap-3">
      <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white text-xl shadow-lg shadow-emerald-500/20 font-black">
        🍱
      </div>
      <div>
        <div className="flex items-center gap-2">
          <span className="font-extrabold text-base md:text-lg tracking-tight text-white">RestoOS BI Platform</span>
          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">ONLINE LIVE</span>
        </div>
        <p className="text-[11px] text-slate-400">Sistem Operasional Rumah Makan & BI Terintegrasi</p>
      </div>
    </div>

    <!-- Role Switcher -->
    <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
      <span className="text-slate-400 font-semibold">Role Pengguna:</span>
      <select id="role-selector" onchange="switchRole(this.value)" className="bg-transparent font-bold text-emerald-400 focus:outline-none cursor-pointer">
        <option value="owner">👑 Owner / Pemilik</option>
        <option value="manager">🛡️ Manajer / Supervisor</option>
        <option value="admin">📝 Admin Input</option>
        <option value="kasir">💳 Kasir</option>
        <option value="karyawan">👤 Karyawan (Absensi Saja)</option>
      </select>
    </div>
  </header>

  <!-- Main Body Layout -->
  <div className="flex flex-col md:flex-row min-h-[calc(100vh-65px)]">
    <!-- Navigation Sidebar -->
    <aside className="w-full md:w-64 bg-slate-950/80 border-r border-slate-800 p-4 space-y-2 shrink-0">
      <div className="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-3 mb-2">Modul Utama</div>
      
      <button onclick="switchTab('dashboard')" id="nav-dashboard" className="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-lg shadow-emerald-500/10">
        📊 1. Dashboard Business BI
      </button>
      <button onclick="switchTab('orders')" id="nav-orders" className="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        🛒 2. Order Management <span id="badge-orders" className="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">2</span>
      </button>
      <button onclick="switchTab('invoices')" id="nav-invoices" className="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        📄 3. Invoice & Billing <span id="badge-invoices" className="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">2</span>
      </button>
      <button onclick="switchTab('finance')" id="nav-finance" className="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        💰 4. Finance & AR Tracker
      </button>
      <button onclick="switchTab('crm')" id="nav-crm" className="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        🔔 5. Customer Follow-up & CRM
      </button>
      <button onclick="switchTab('attendance')" id="nav-attendance" className="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        📸 6. Absensi Selfie & Geofence
      </button>
    </aside>

    <!-- Main Dynamic Content Workspace -->
    <main id="main-content" className="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full overflow-x-hidden">
      <!-- Content renders dynamically via Vanilla JS -->
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" className="fixed bottom-6 right-6 z-50 pointer-events-none"></div>

  <!-- Modal Container -->
  <div id="modal-container" className="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div id="modal-content" className="relative w-full max-w-2xl rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden max-h-[90vh] flex flex-col p-6">
      <!-- Modal Header & Body renders dynamically -->
    </div>
  </div>

  <!-- Pure Vanilla JavaScript Engine -->
  <script>
    // Master State with LocalStorage Persistence
    const state = {
      role: 'owner',
      currentTab: 'dashboard',
      orders: JSON.parse(localStorage.getItem('resto_live_orders')) || [
        {
          id: 'ORD-20260805-001',
          customerName: 'Bpk. Hendra Wijaya',
          customerPhone: '081234567890',
          customerAddress: 'Jl. Sudirman No. 45',
          orderType: 'Catering',
          status: 'Diproses',
          orderDate: '2026-08-05T09:30:00',
          servingDate: '2026-08-06T11:00:00',
          items: [{ name: 'Nasi Tumpeng Mini Komplit', qty: 25, price: 45000, notes: 'Pedas sedang' }, { name: 'Es Jeruk Peras Alami', qty: 25, price: 10000, notes: 'Es dipisah' }],
          subtotal: 1375000, tax: 137500, shippingFee: 50000, totalAmount: 1562500, notes: 'Acara syukuran kantor'
        },
        {
          id: 'ORD-20260805-002',
          customerName: 'Sdri. Maya Indah',
          customerPhone: '087811223344',
          customerAddress: 'Apt Rasuna Tower 3',
          orderType: 'Dine-in',
          status: 'Selesai',
          orderDate: '2026-08-05T12:15:00',
          servingDate: '2026-08-05T12:30:00',
          items: [{ name: 'Ayam Goreng Kremes + Nasi', qty: 2, price: 32000, notes: '' }, { name: 'Es Teh Manis Jumbo', qty: 2, price: 7000, notes: '' }],
          subtotal: 78000, tax: 7800, shippingFee: 0, totalAmount: 85800, notes: 'Meja No. 04'
        }
      ],
      invoices: JSON.parse(localStorage.getItem('resto_live_invoices')) || [
        {
          id: 'INV-20260805-001', orderId: 'ORD-20260805-001', customerName: 'Bpk. Hendra Wijaya', customerPhone: '081234567890', customerAddress: 'Jl. Sudirman No. 45', issueDate: '2026-08-05', dueDate: '2026-08-08', totalAmount: 1562500, paidAmount: 500000, remainingAmount: 1062500, status: 'Sebagian Dibayar', paymentMethod: 'Transfer BCA', items: [{ name: 'Nasi Tumpeng Mini Komplit', qty: 25, price: 45000 }, { name: 'Es Jeruk Peras Alami', qty: 25, price: 10000 }], tax: 137500, shippingFee: 50000
        },
        {
          id: 'INV-20260801-004', orderId: 'ORD-20260804-008', customerName: 'PT Sinergi Mandiri (Bpk. Anton)', customerPhone: '085678901234', customerAddress: 'Kawasan Pulogadung', issueDate: '2026-08-01', dueDate: '2026-08-04', totalAmount: 5650000, paidAmount: 0, remainingAmount: 5650000, status: 'Jatuh Tempo', paymentMethod: 'Transfer Mandiri', items: [{ name: 'Paket Catering Prasmanan (50 Porsi)', qty: 2, price: 2500000 }], tax: 500000, shippingFee: 150000
        }
      ],
      expenses: JSON.parse(localStorage.getItem('resto_live_expenses')) || [
        { id: 'EXP-001', date: '2026-08-05', category: 'Bahan Baku', description: 'Belanja Pasar Senen: Ayam & Daging', amount: 1450000, receiptImage: 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=300&q=80' },
        { id: 'EXP-002', date: '2026-08-04', category: 'Operasional', description: 'Gas LPG 12kg (3 tabung)', amount: 630000, receiptImage: null }
      ],
      attendance: JSON.parse(localStorage.getItem('resto_live_attendance')) || [
        { id: 'att-1', name: 'Budi Santoso', role: 'Koki Utama', date: '2026-08-05', checkInTime: '07:45:12', checkOutTime: '17:05:00', status: 'Hadir Tepat Waktu', statusCode: 'H', photoUrl: 'https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=200&q=80', distanceMeters: 24, isOutRadius: false },
        { id: 'att-2', name: 'Siti Aminah', role: 'Kasir & Admin', date: '2026-08-05', checkInTime: '08:18:40', checkOutTime: null, status: 'Terlambat', statusCode: 'T', photoUrl: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=200&q=80', distanceMeters: 65, isOutRadius: false }
      ],
      reminders: JSON.parse(localStorage.getItem('resto_live_reminders')) || [
        { id: 'rem-1', type: 'Payment Overdue', title: 'Invoice Overdue H+1', customerName: 'PT Sinergi Mandiri', customerPhone: '085678901234', amount: 5650000, status: 'Pending', waTemplate: 'Halo Bpk. Anton, mengingatkan Invoice INV-20260801-004 telah jatuh tempo. Mohon info pelunasan. Terima kasih!' },
        { id: 'rem-2', type: 'Payment Reminder', title: 'Follow-up H-1 Pembayaran', customerName: 'Bpk. Hendra Wijaya', customerPhone: '081234567890', amount: 1062500, status: 'Pending', waTemplate: 'Halo Bpk. Hendra, mengingatkan sisa tagihan Rp 1.062.500. Terima kasih!' }
      ]
    };

    function saveState() {
      localStorage.setItem('resto_live_orders', JSON.stringify(state.orders));
      localStorage.setItem('resto_live_invoices', JSON.stringify(state.invoices));
      localStorage.setItem('resto_live_expenses', JSON.stringify(state.expenses));
      localStorage.setItem('resto_live_attendance', JSON.stringify(state.attendance));
      localStorage.setItem('resto_live_reminders', JSON.stringify(state.reminders));
    }

    function formatRupiah(num) {
      if (!num) return 'Rp 0';
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    }

    function getWhatsAppLink(phone, text) {
      if (!phone) return '#';
      let formatted = phone.replace(/\D/g, '');
      if (formatted.startsWith('0')) formatted = '62' + formatted.slice(1);
      return `https://wa.me/${formatted}?text=${encodeURIComponent(text)}`;
    }

    function showToast(title, message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'p-4 rounded-2xl bg-slate-900 border border-emerald-500 text-emerald-300 text-xs font-bold shadow-2xl mb-3 pointer-events-auto transition-all transform duration-300';
      toast.innerHTML = `<div>${title}</div><div class="text-slate-300 font-normal mt-0.5">${message}</div>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function switchRole(newRole) {
      state.role = newRole;
      if (newRole === 'karyawan' && state.currentTab !== 'attendance') {
        switchTab('attendance');
      } else {
        renderCurrentTab();
      }
      showToast('Role Berubah', `Role aktif sekarang: ${newRole.toUpperCase()}`);
    }

    function switchTab(tabId) {
      state.currentTab = tabId;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = 'nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900';
      });
      const activeNav = document.getElementById(`nav-${tabId}`);
      if (activeNav) {
        activeNav.className = 'nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-lg shadow-emerald-500/10';
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (state.currentTab === 'dashboard') renderDashboard(container);
      else if (state.currentTab === 'orders') renderOrders(container);
      else if (state.currentTab === 'invoices') renderInvoices(container);
      else if (state.currentTab === 'finance') renderFinance(container);
      else if (state.currentTab === 'crm') renderCRM(container);
      else if (state.currentTab === 'attendance') renderAttendance(container);
    }

    // Render 1: Dashboard BI
    function renderDashboard(container) {
      const activeOrdersCount = state.orders.filter(o => o.status !== 'Selesai').length;
      const unpaidTotal = state.invoices.reduce((s, i) => s + i.remainingAmount, 0);

      container.innerHTML = `
        <div class="space-y-6">
          <div class="p-6 rounded-3xl bg-gradient-to-r from-emerald-950 via-slate-900 to-slate-900 border border-emerald-500/30">
            <h1 class="text-2xl font-extrabold text-white">Business Intelligence Center</h1>
            <p class="text-xs text-slate-400 mt-1">Pantau omset harian, order aktif, piutang tagihan, dan absensi staf secara real-time.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Penjualan Hari Ini</div>
              <div class="text-2xl font-extrabold text-white mt-2">${formatRupiah(3250000)}</div>
              <div class="text-xs text-emerald-400 font-semibold mt-1">+14.2% vs kemarin</div>
            </div>
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Order Aktif (Diproses)</div>
              <div class="text-2xl font-extrabold text-cyan-300 mt-2">${activeOrdersCount} Order</div>
              <div class="text-xs text-slate-400 mt-1">Dapur & Catering</div>
            </div>
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Tagihan Belum Lunas</div>
              <div class="text-2xl font-extrabold text-rose-300 mt-2">${formatRupiah(unpaidTotal)}</div>
              <div class="text-xs text-rose-400 mt-1">${state.invoices.filter(i => i.remainingAmount > 0).length} invoice perlu ditagih</div>
            </div>
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Kehadiran Staf Hari Ini</div>
              <div class="text-2xl font-extrabold text-white mt-2">${state.attendance.length} / 5 Staf</div>
              <div class="text-xs text-amber-400 font-semibold mt-1">Foto Selfie + GPS Verifikasi</div>
            </div>
          </div>

          <div class="p-6 rounded-3xl glass-card">
            <h3 class="text-base font-bold text-white mb-4">Tren Penjualan Harian (Chart.js)</h3>
            <canvas id="salesChart" class="max-h-64"></canvas>
          </div>
        </div>
      `;

      setTimeout(() => {
        const ctx = document.getElementById('salesChart');
        if (ctx) {
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'],
              datasets: [{ label: 'Omset Harian (Rp)', data: [2400000, 3100000, 2800000, 4200000, 5800000, 8400000, 7200000], backgroundColor: '#10b981', borderRadius: 8 }]
            },
            options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#64748b' } }, y: { ticks: { color: '#64748b' } } } }
          });
        }
      }, 100);
    }

    // Render 2: Order Management
    function renderOrders(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h2 className="text-xl font-extrabold text-white">Order Management (Dapur & Catering)</h2>
              <p className="text-xs text-slate-400">Pencatatan orderan masuk & bon dapur.</p>
            </div>
            <button onclick="openOrderModal()" className="px-5 py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 font-bold text-xs text-white shadow-lg shadow-emerald-500/25">
              + Tambah Order Baru
            </button>
          </div>

          <div className="rounded-3xl glass-card overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="bg-slate-900 text-slate-400 border-b border-slate-800 uppercase text-[10px]">
                    <th className="p-4">No. Order</th>
                    <th className="p-4">Pelanggan</th>
                    <th className="p-4">Tipe</th>
                    <th className="p-4">Items Pesanan</th>
                    <th className="p-4">Total Nilai</th>
                    <th className="p-4">Status</th>
                    <th className="p-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  ${state.orders.map(o => `
                    <tr class="hover:bg-slate-900/50">
                      <td class="p-4 font-extrabold text-white">${o.id}</td>
                      <td class="p-4 font-bold text-slate-200">${o.customerName}<div class="text-[10px] text-slate-400">${o.customerPhone}</div></td>
                      <td class="p-4 text-amber-300 font-bold">${o.orderType}</td>
                      <td class="p-4 text-slate-300">${o.items.map(it => `<div>${it.qty}x ${it.name}</div>`).join('')}</td>
                      <td class="p-4 font-extrabold text-emerald-400">${formatRupiah(o.totalAmount)}</td>
                      <td class="p-4"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${o.status === 'Selesai' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${o.status}</span></td>
                      <td class="p-4 text-right space-x-2">
                        <button onclick="showKitchenBon('${o.id}')" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-[11px]">Bon Dapur</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // Render 3: Invoice & Billing
    function renderInvoices(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <div>
            <h2 className="text-xl font-extrabold text-white">Invoice & Billing System</h2>
            <p className="text-xs text-slate-400">Penagihan otomatis & pengiriman via WhatsApp / PDF.</p>
          </div>

          <div className="rounded-3xl glass-card overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="bg-slate-900 text-slate-400 border-b border-slate-800 uppercase text-[10px]">
                    <th className="p-4">No. Invoice</th>
                    <th className="p-4">Pelanggan</th>
                    <th className="p-4">Total Tagihan</th>
                    <th className="p-4">Sisa Tagihan</th>
                    <th className="p-4">Status</th>
                    <th className="p-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  ${state.invoices.map(inv => `
                    <tr class="hover:bg-slate-900/50">
                      <td class="p-4 font-extrabold text-white">${inv.id}</td>
                      <td class="p-4 font-bold text-slate-200">${inv.customerName}</td>
                      <td class="p-4 font-extrabold text-white">${formatRupiah(inv.totalAmount)}</td>
                      <td class="p-4 font-extrabold text-rose-400">${formatRupiah(inv.remainingAmount)}</td>
                      <td class="p-4"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${inv.status === 'Lunas' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${inv.status}</span></td>
                      <td class="p-4 text-right space-x-2">
                        <a href="${getWhatsAppLink(inv.customerPhone, `Halo Kak ${inv.customerName}, berikut invoice ${inv.id} sebesar ${formatRupiah(inv.totalAmount)}. Terima kasih!`)}" target="_blank" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px] shadow-lg shadow-emerald-600/30">Kirim WA</a>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // Render 4: Finance Tracker
    function renderFinance(container) {
      const totalExpenses = state.expenses.reduce((s, e) => s + e.amount, 0);
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <div>
              <h2 className="text-xl font-extrabold text-white">Finance & Accounts Receivable Tracker</h2>
              <p className="text-xs text-slate-400">Pemasukan, piutang, dan pengeluaran operasional.</p>
            </div>
            <button onclick="openExpenseModal()" className="px-4 py-2 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs shadow-lg shadow-rose-500/25">
              + Catat Pengeluaran
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="p-5 rounded-2xl glass-card">
              <div className="text-xs text-slate-400 font-semibold">Total Pemasukan Kas</div>
              <div className="text-2xl font-extrabold text-emerald-400 mt-2">${formatRupiah(13500000)}</div>
            </div>
            <div className="p-5 rounded-2xl glass-card">
              <div className="text-xs text-slate-400 font-semibold">Total Pengeluaran Operasional</div>
              <div className="text-2xl font-extrabold text-rose-400 mt-2">${formatRupiah(totalExpenses)}</div>
            </div>
            <div className="p-5 rounded-2xl glass-card bg-emerald-950/40 border-emerald-500/30">
              <div className="text-xs text-emerald-300 font-bold">Estimasi Laba Bersih</div>
              <div className="text-2xl font-extrabold text-white mt-2">${formatRupiah(13500000 - totalExpenses)}</div>
            </div>
          </div>
        </div>
      `;
    }

    // Render 5: CRM
    function renderCRM(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <h2 className="text-xl font-extrabold text-white">Customer Follow-up & CRM</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${state.reminders.map(rem => `
              <div class="p-5 rounded-3xl glass-card space-y-3">
                <div class="flex justify-between items-center">
                  <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300">${rem.type}</span>
                  <span class="text-[10px] text-amber-400 font-bold">Pending Action</span>
                </div>
                <h4 class="text-sm font-bold text-white">${rem.title}</h4>
                <div class="p-3 rounded-2xl bg-slate-950 text-xs">
                  <div class="font-bold text-white">${rem.customerName}</div>
                  <div class="text-rose-400 font-bold mt-1">Nominal: ${formatRupiah(rem.amount)}</div>
                </div>
                <a href="${getWhatsAppLink(rem.customerPhone, rem.waTemplate)}" target="_blank" class="w-full block text-center py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow-lg shadow-emerald-600/30">
                  Kirim WA Follow-up
                </a>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Render 6: Attendance
    function renderAttendance(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <div>
              <h2 className="text-xl font-extrabold text-white">Absensi Foto Selfie & Geofencing GPS</h2>
              <p className="text-xs text-slate-400">Verifikasi kehadiran visual + koordinat lokasi 100m.</p>
            </div>
            <button onclick="openCameraModal()" className="px-5 py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 font-bold text-xs text-white shadow-lg shadow-emerald-500/25">
              📸 Check-in Absen Masuk
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${state.attendance.map(att => `
              <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center gap-4">
                <img src="${att.photoUrl}" alt="${att.name}" class="w-16 h-16 rounded-2xl object-cover border-2 border-emerald-500" />
                <div>
                  <div class="font-bold text-sm text-white">${att.name}</div>
                  <div class="text-xs text-slate-400">${att.role}</div>
                  <div class="text-xs font-bold text-emerald-400 mt-1">${att.checkInTime} WIB (${att.status})</div>
                  <div class="text-[10px] text-cyan-300 mt-0.5">GPS Distance: ${att.distanceMeters}m (Radius Ok)</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Modal Handlers
    function openOrderModal() {
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md';
      content.innerHTML = `
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
          <h3 class="text-base font-bold text-white">📝 Input Order Baru</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
        </div>
        <form onsubmit="submitNewOrder(event)" class="space-y-4 pt-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Nama Pelanggan *</label>
            <input type="text" id="ord-cust-name" required placeholder="Bpk. Hendra Wijaya" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-slate-400 block mb-1">No. HP / WA</label>
              <input type="text" id="ord-cust-phone" placeholder="081234567890" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" />
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-400 block mb-1">Tipe Order</label>
              <select id="ord-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none font-bold">
                <option value="Dine-in">Dine-in</option>
                <option value="Take Away">Take Away</option>
                <option value="Catering">Catering</option>
              </select>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Pilih Menu</label>
            <select id="ord-item-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none font-bold">
              <option value="Nasi Tumpeng Mini Komplit|45000">Nasi Tumpeng Mini Komplit (Rp 45.000)</option>
              <option value="Ayam Goreng Kremes + Nasi|32000">Ayam Goreng Kremes + Nasi (Rp 32.000)</option>
              <option value="Bebek Bakar Madu Spesial|48000">Bebek Bakar Madu Spesial (Rp 48.000)</option>
            </select>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-500/25">Simpan Order</button>
          </div>
        </form>
      `;
    }

    function submitNewOrder(e) {
      e.preventDefault();
      const name = document.getElementById('ord-cust-name').value;
      const phone = document.getElementById('ord-cust-phone').value;
      const type = document.getElementById('ord-type').value;
      const itemVal = document.getElementById('ord-item-name').value.split('|');
      const itemName = itemVal[0];
      const itemPrice = Number(itemVal[1]);

      const newOrder = {
        id: `ORD-${Date.now().toString().slice(-4)}`,
        customerName: name,
        customerPhone: phone || '081234567890',
        orderType: type,
        status: 'Diproses',
        items: [{ name: itemName, qty: 10, price: itemPrice }],
        totalAmount: itemPrice * 10
      };

      state.orders.unshift(newOrder);
      saveState();
      closeModal();
      renderOrders(document.getElementById('main-content'));
      showToast('Order Ditambahkan', `Order baru ${newOrder.id} tersimpan!`);
    }

    function showKitchenBon(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md';
      content.innerHTML = `
        <div id="printable-area" class="p-6 bg-slate-950 text-white font-mono text-xs rounded-2xl space-y-3">
          <div class="text-center border-b border-dashed border-slate-700 pb-2">
            <h3 class="font-extrabold text-base text-emerald-400">🍳 BON DAPUR RESTO</h3>
            <div>NO ORDER: ${order.id}</div>
          </div>
          <div>Pelanggan: <b>${order.customerName}</b> (${order.orderType})</div>
          <div class="space-y-1 py-2 border-y border-dashed border-slate-700">
            ${order.items.map(it => `<div><b>${it.qty}x</b> ${it.name}</div>`).join('')}
          </div>
          <div class="text-center text-[10px] text-slate-500">*** RESTO-OS LIVE SYSTEM ***</div>
        </div>
        <div class="flex justify-end gap-2 pt-4 no-print">
          <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">Tutup</button>
          <button onclick="window.print()" class="px-4 py-2 bg-emerald-500 text-xs font-bold rounded-xl text-white">Cetak Bon</button>
        </div>
      `;
    }

    function openExpenseModal() {
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md';
      content.innerHTML = `
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
          <h3 class="text-base font-bold text-white">💸 Catat Pengeluaran Operasional</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
        </div>
        <form onsubmit="submitExpense(event)" class="space-y-4 pt-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Kategori</label>
            <select id="exp-cat" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none font-bold">
              <option value="Bahan Baku">Bahan Baku Pasar</option>
              <option value="Operasional">Gas LPG & Listrik</option>
              <option value="Gaji">Gaji Staf</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Deskripsi *</label>
            <input type="text" id="exp-desc" required placeholder="Belanja Ayam Pasar Senen" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Nominal (Rp) *</label>
            <input type="number" id="exp-amount" required placeholder="500000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 font-bold" />
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-rose-500 text-xs font-bold text-white shadow-lg shadow-rose-500/25">Simpan Pengeluaran</button>
          </div>
        </form>
      `;
    }

    function submitExpense(e) {
      e.preventDefault();
      const cat = document.getElementById('exp-cat').value;
      const desc = document.getElementById('exp-desc').value;
      const amount = Number(document.getElementById('exp-amount').value);

      const newExpense = {
        id: `EXP-${Date.now().toString().slice(-4)}`,
        date: new Date().toISOString().slice(0, 10),
        category: cat,
        description: desc,
        amount,
        receiptImage: null
      };

      state.expenses.unshift(newExpense);
      saveState();
      closeModal();
      renderFinance(document.getElementById('main-content'));
      showToast('Pengeluaran Dicatat', `Pengeluaran Rp ${amount.toLocaleString('id-ID')} tersimpan.`);
    }

    function openCameraModal() {
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md';
      content.innerHTML = `
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
          <h3 class="text-base font-bold text-white">📸 Live Absensi Foto Selfie</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
        </div>
        <div class="space-y-4 pt-4 text-center">
          <div class="w-full h-48 rounded-2xl bg-slate-950 border border-slate-800 flex flex-col items-center justify-center p-4">
            <img id="selfie-preview" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover rounded-xl" />
          </div>
          <div class="text-xs text-emerald-400 font-bold">GPS Radius Verifikasi: 28m dari Resto (Dalam Radius)</div>
          <button onclick="submitAttendance()" class="w-full py-2.5 rounded-xl bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-500/25">
            Kirim Absensi Check-in
          </button>
        </div>
      `;
    }

    function submitAttendance() {
      const newAtt = {
        id: `att-${Date.now()}`,
        name: 'Siti Aminah',
        role: 'Kasir & Admin',
        date: new Date().toISOString().slice(0, 10),
        checkInTime: new Date().toLocaleTimeString('id-ID'),
        status: 'Hadir Tepat Waktu',
        statusCode: 'H',
        photoUrl: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=200&q=80',
        distanceMeters: 28,
        isOutRadius: false
      };

      state.attendance.unshift(newAtt);
      saveState();
      closeModal();
      renderAttendance(document.getElementById('main-content'));
      showToast('Absensi Sukses!', 'Absensi foto selfie & GPS berhasil tersimpan.');
    }

    function closeModal() {
      document.getElementById('modal-container').className = 'hidden';
    }

    // Initialize App on Page Load
    window.onload = function() {
      renderCurrentTab();
    };
  </script>
</body>
</html>
