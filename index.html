<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoOS — Sistem Manajemen Rumah Makan (Integrasi Terhubung Full)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f1f5f9; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    .glass-card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .glass-card-hover:hover { border-color: rgba(34, 197, 94, 0.3); transform: translateY(-2px); box-shadow: 0 12px 40px -10px rgba(34, 197, 94, 0.15); }
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen selection:bg-emerald-500 selection:text-white">
  
  <!-- Header Bar -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-800 bg-slate-950/90 backdrop-blur-xl px-4 md:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white text-xl shadow-lg shadow-emerald-500/20 font-black">
        🍱
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-base md:text-lg tracking-tight text-white">RestoOS BI Platform</span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> INTEGRATED DATA LINKED
          </span>
        </div>
        <p class="text-[11px] text-slate-400">Order → Invoice → CRM → Finance Terhubung Otomatis</p>
      </div>
    </div>

    <!-- Role Switcher -->
    <div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-1 text-[11px] font-semibold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-xl border border-emerald-500/20">
        ⚡ Data Cloud Linked
      </div>

      <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
        <span class="text-slate-400 font-semibold">Simulasi Role:</span>
        <select id="role-selector" onchange="switchRole(this.value)" class="bg-transparent font-bold text-emerald-400 focus:outline-none cursor-pointer">
          <option value="owner">👑 Owner / Pemilik</option>
          <option value="manager">🛡️ Manajer / Supervisor</option>
          <option value="admin">📝 Admin Input</option>
          <option value="kasir">💳 Kasir</option>
          <option value="karyawan">👤 Karyawan (Absensi Saja)</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Sidebar & Main Workspace -->
  <div class="flex flex-col md:flex-row min-h-[calc(100vh-65px)]">
    <aside class="w-full md:w-64 bg-slate-950/80 border-r border-slate-800 p-4 space-y-2 shrink-0">
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-3 mb-2">Modul Terintegrasi</div>
      
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-lg shadow-emerald-500/10">
        📊 1. Business BI Dashboard
      </button>
      <button onclick="switchTab('orders')" id="nav-orders" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        🛒 2. Order Management <span id="badge-orders" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">0</span>
      </button>
      <button onclick="switchTab('invoices')" id="nav-invoices" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        📄 3. Invoice & Billing <span id="badge-invoices" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">0</span>
      </button>
      <button onclick="switchTab('finance')" id="nav-finance" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        💰 4. Finance & AR Tracker
      </button>
      <button onclick="switchTab('crm')" id="nav-crm" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        🔔 5. Customer Follow-up & CRM <span id="badge-crm" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">0</span>
      </button>
      <button onclick="switchTab('attendance')" id="nav-attendance" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        📸 6. Absensi Selfie & Geofence
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900">
        ⚙️ 7. Pengaturan Usaha
      </button>
    </aside>

    <main id="main-content" class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full overflow-x-hidden">
      <!-- Dynamic View -->
    </main>
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 pointer-events-none"></div>

  <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div id="modal-content" class="relative w-full max-w-2xl rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden max-h-[90vh] flex flex-col p-6">
      <!-- Dynamic Modal -->
    </div>
  </div>

  <script>
    // Master State with Full Cross-Module Linking
    const state = {
      role: 'owner',
      currentTab: 'dashboard',
      customers: JSON.parse(localStorage.getItem('resto_linked_customers')) || [
        { id: 'c1', name: 'Bpk. Hendra Wijaya', phone: '081234567890', address: 'Jl. Sudirman No. 45, Jakarta Selatan', tag: 'VIP', lifetimeValue: 12500000, totalOrders: 8, notes: 'Suka pedas sedang, Minta invoice via WA' },
        { id: 'c2', name: 'Ibu Ratna Pertiwi', phone: '081987654321', address: 'Wisma Asri Lt. 4, Kebayoran Baru', tag: 'Catering Regular', lifetimeValue: 8400000, totalOrders: 4, notes: 'Order harian 20 porsi' },
        { id: 'c3', name: 'PT Sinergi Mandiri (Bpk. Anton)', phone: '085678901234', address: 'Kawasan Pulogadung Blok C-12', tag: 'Corporate', lifetimeValue: 24500000, totalOrders: 6, notes: 'Transfer bank tenor 7 hari' },
        { id: 'c4', name: 'Sdri. Maya Indah', phone: '087811223344', address: 'Apt Rasuna Tower 3 Apt 12B', tag: 'Pelanggan Baru', lifetimeValue: 350000, totalOrders: 1, notes: 'Tanpa santan' }
      ],
      orders: JSON.parse(localStorage.getItem('resto_linked_orders')) || [
        {
          id: 'ORD-20260805-001',
          customerId: 'c1',
          customerName: 'Bpk. Hendra Wijaya',
          customerPhone: '081234567890',
          customerAddress: 'Jl. Sudirman No. 45, Jakarta Selatan',
          orderType: 'Catering',
          status: 'Diproses',

          subtotal: 1375000, tax: 137500, shippingFee: 50000, totalAmount: 1562500, notes: 'Acara syukuran kantor'
        },
        {
          id: 'ORD-20260805-002',
          customerId: 'c4',
          customerName: 'Sdri. Maya Indah',
          customerPhone: '087811223344',
          customerAddress: 'Apt Rasuna Tower 3 Apt 12B',
          orderType: 'Dine-in',
          status: 'Selesai',
          orderDate: '2026-08-05T12:15:00',
          servingDate: '2026-08-05T12:30:00',
          items: [{ name: 'Ayam Goreng Kremes + Nasi', qty: 2, price: 32000, notes: '' }, { name: 'Es Teh Manis Jumbo', qty: 2, price: 7000, notes: '' }],
          subtotal: 78000, tax: 7800, shippingFee: 0, totalAmount: 85800, notes: 'Meja No. 04'
        }
      ],
      invoices: JSON.parse(localStorage.getItem('resto_linked_invoices')) || [
        {
          id: 'INV-20260805-001', orderId: 'ORD-20260805-001', customerId: 'c1', customerName: 'Bpk. Hendra Wijaya', customerPhone: '081234567890', customerAddress: 'Jl. Sudirman No. 45', issueDate: '2026-08-05', dueDate: '2026-08-08', totalAmount: 1562500, paidAmount: 500000, remainingAmount: 1062500, status: 'Sebagian Dibayar', paymentMethod: 'Transfer BCA', items: [{ name: 'Nasi Tumpeng Mini Komplit', qty: 25, price: 45000 }, { name: 'Es Jeruk Peras Alami', qty: 25, price: 10000 }], tax: 137500, shippingFee: 50000
        },
        {
          id: 'INV-20260801-004', orderId: 'ORD-20260804-008', customerId: 'c3', customerName: 'PT Sinergi Mandiri (Bpk. Anton)', customerPhone: '085678901234', customerAddress: 'Kawasan Pulogadung', issueDate: '2026-08-01', dueDate: '2026-08-04', totalAmount: 5650000, paidAmount: 0, remainingAmount: 5650000, status: 'Jatuh Tempo', paymentMethod: 'Transfer Mandiri', items: [{ name: 'Paket Catering Prasmanan (50 Porsi)', qty: 2, price: 2500000 }], tax: 500000, shippingFee: 150000
        }
      ],
      expenses: JSON.parse(localStorage.getItem('resto_linked_expenses')) || [
        { id: 'EXP-001', date: '2026-08-05', category: 'Bahan Baku', description: 'Belanja Pasar Senen: Ayam & Daging', amount: 1450000, receiptImage: 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=300&q=80' },
        { id: 'EXP-002', date: '2026-08-04', category: 'Operasional', description: 'Gas LPG 12kg (3 tabung)', amount: 630000, receiptImage: null }
      ],
      attendance: JSON.parse(localStorage.getItem('resto_linked_attendance')) || [
        { id: 'att-1', name: 'Budi Santoso', role: 'Koki Utama', date: '2026-08-05', checkInTime: '07:45:12', checkOutTime: '17:05:00', status: 'Hadir Tepat Waktu', statusCode: 'H', photoUrl: 'https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=200&q=80', distanceMeters: 24, isOutRadius: false },
        { id: 'att-2', name: 'Siti Aminah', role: 'Kasir & Admin', date: '2026-08-05', checkInTime: '08:18:40', checkOutTime: null, status: 'Terlambat', statusCode: 'T', photoUrl: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=200&q=80', distanceMeters: 65, isOutRadius: false }
      ],
      reminders: JSON.parse(localStorage.getItem('resto_linked_reminders')) || [
        { id: 'rem-1', type: 'Payment Overdue', title: 'Invoice Overdue H+1', customerName: 'PT Sinergi Mandiri', customerPhone: '085678901234', amount: 5650000, status: 'Pending', waTemplate: 'Halo Bpk. Anton dari PT Sinergi Mandiri, mengingatkan Invoice INV-20260801-004 sebesar Rp 5.650.000 telah jatuh tempo. Mohon konfirmasi pelunasan. Terima kasih!' },
        { id: 'rem-2', type: 'Payment Reminder', title: 'Follow-up H-1 Pembayaran', customerName: 'Bpk. Hendra Wijaya', customerPhone: '081234567890', amount: 1062500, status: 'Pending', waTemplate: 'Halo Bpk. Hendra Wijaya, mengingatkan sisa tagihan invoice sebesar Rp 1.062.500. Terima kasih!' }
      ]
    };

    function saveState() {
      localStorage.setItem('resto_linked_customers', JSON.stringify(state.customers));
      localStorage.setItem('resto_linked_orders', JSON.stringify(state.orders));
      localStorage.setItem('resto_linked_invoices', JSON.stringify(state.invoices));
      localStorage.setItem('resto_linked_expenses', JSON.stringify(state.expenses));
      localStorage.setItem('resto_linked_attendance', JSON.stringify(state.attendance));
      localStorage.setItem('resto_linked_reminders', JSON.stringify(state.reminders));
      updateBadges();
    }

    function updateBadges() {
      const bOrders = document.getElementById('badge-orders');
      const bInvoices = document.getElementById('badge-invoices');
      const bCrm = document.getElementById('badge-crm');
      if (bOrders) bOrders.innerText = state.orders.length;
      if (bInvoices) bInvoices.innerText = state.invoices.length;
      if (bCrm) bCrm.innerText = state.customers.length;
    }

    function formatRupiah(num) {
      if (!num) return 'Rp 0';
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    }

    function getWhatsAppLink(phone, text) {
      if (!phone) return '#';
      let formatted = phone.replace(/\D/g, '');
      if (formatted.startsWith('0')) formatted = '62' + formatted.slice(1);
      return `https://wa.me/${formatted}?text=${encodeURIComponent(text)}`;
    }

    function showToast(title, message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'p-4 rounded-2xl bg-slate-900 border border-emerald-500 text-emerald-300 text-xs font-bold shadow-2xl mb-3 pointer-events-auto transition-all transform duration-300';
      toast.innerHTML = `<div>${title}</div><div class="text-slate-300 font-normal mt-0.5">${message}</div>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function switchRole(newRole) {
      state.role = newRole;
      if (newRole === 'karyawan' && state.currentTab !== 'attendance') {
        switchTab('attendance');
      } else {
        renderCurrentTab();
      }
      showToast('Role Berubah', `Role aktif: ${newRole.toUpperCase()}`);
    }

    function switchTab(tabId) {
      state.currentTab = tabId;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = 'nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900';
      });
      const activeNav = document.getElementById(`nav-${tabId}`);
      if (activeNav) {
        activeNav.className = 'nav-btn w-full text-left p-3 rounded-2xl text-xs font-bold transition-all bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-lg shadow-emerald-500/10';
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (state.currentTab === 'dashboard') renderDashboard(container);
      else if (state.currentTab === 'orders') renderOrders(container);
      else if (state.currentTab === 'invoices') renderInvoices(container);
      else if (state.currentTab === 'finance') renderFinance(container);
      else if (state.currentTab === 'crm') renderCRM(container);
      else if (state.currentTab === 'attendance') renderAttendance(container);
      else if (state.currentTab === 'settings') renderSettings(container);
      updateBadges();
    }

    // 1. Dashboard BI
    function renderDashboard(container) {
      const activeOrdersCount = state.orders.filter(o => o.status !== 'Selesai').length;
      const unpaidTotal = state.invoices.reduce((s, i) => s + i.remainingAmount, 0);

      container.innerHTML = `
        <div class="space-y-6">
          <div class="p-6 rounded-3xl bg-gradient-to-r from-emerald-950 via-slate-900 to-slate-900 border border-emerald-500/30">
            <h1 class="text-2xl font-extrabold text-white">Business Intelligence Center</h1>
            <p class="text-xs text-slate-400 mt-1">Order → Invoice → CRM terintegrasi otomatis secara terpusat.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Penjualan Hari Ini</div>
              <div class="text-2xl font-extrabold text-white mt-2">${formatRupiah(3250000)}</div>
              <div class="text-xs text-emerald-400 font-semibold mt-1">+14.2% vs kemarin</div>
            </div>
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Order Aktif (Diproses)</div>
              <div class="text-2xl font-extrabold text-cyan-300 mt-2">${activeOrdersCount} Order</div>
              <div class="text-xs text-slate-400 mt-1">Dapur & Catering</div>
            </div>
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Tagihan Belum Lunas</div>
              <div class="text-2xl font-extrabold text-rose-300 mt-2">${formatRupiah(unpaidTotal)}</div>
              <div class="text-xs text-rose-400 mt-1">${state.invoices.filter(i => i.remainingAmount > 0).length} invoice perlu ditagih</div>
            </div>
            <div class="p-5 rounded-2xl glass-card">
              <div class="text-xs text-slate-400 font-semibold">Database Pelanggan CRM</div>
              <div class="text-2xl font-extrabold text-amber-300 mt-2">${state.customers.length} Pelanggan</div>
              <div class="text-xs text-slate-400 mt-1">Terhubung ke Form Order</div>
            </div>
          </div>

          <div class="p-6 rounded-3xl glass-card">
            <h3 class="text-base font-bold text-white mb-4">Tren Penjualan Harian (Chart.js)</h3>
            <canvas id="salesChart" class="max-h-64"></canvas>
          </div>
        </div>
      `;

      setTimeout(() => {
        const ctx = document.getElementById('salesChart');
        if (ctx) {
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'],
              datasets: [{ label: 'Omset Harian (Rp)', data: [2400000, 3100000, 2800000, 4200000, 5800000, 8400000, 7200000], backgroundColor: '#10b981', borderRadius: 8 }]
            },
            options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#64748b' } }, y: { ticks: { color: '#64748b' } } } }
          });
        }
      }, 100);
    }

    // 2. Order Management
    function renderOrders(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h2 class="text-xl font-extrabold text-white">Order Management (Dapur & Catering)</h2>
              <p class="text-xs text-slate-400">Terhubung langsung dengan Database Pelanggan & Module Invoice.</p>
            </div>
            <button onclick="openOrderModal()" class="px-5 py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 font-bold text-xs text-white shadow-lg shadow-emerald-500/25">
              + Tambah Order Baru
            </button>
          </div>

          <div class="rounded-3xl glass-card overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="bg-slate-900 text-slate-400 border-b border-slate-800 uppercase text-[10px]">
                    <th class="p-4">No. Order</th>
                    <th class="p-4">Pelanggan (CRM)</th>
                    <th class="p-4">Tipe</th>
                    <th class="p-4">Items Pesanan</th>
                    <th class="p-4">Total Nilai</th>
                    <th class="p-4">Status</th>
                    <th class="p-4 text-right">Aksi Terintegrasi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${state.orders.map(o => `
                    <tr class="hover:bg-slate-900/50">
                      <td class="p-4 font-extrabold text-white">${o.id}</td>
                      <td class="p-4 font-bold text-slate-200">${o.customerName}<div class="text-[10px] text-slate-400">${o.customerPhone}</div></td>
                      <td class="p-4 text-amber-300 font-bold">${o.orderType}</td>
                      <td class="p-4 text-slate-300">
                        ${o.items.map(it => `<div><span class="font-extrabold text-emerald-400">${it.qty}x</span> ${it.name} ${it.notes ? `<span class="text-[10px] text-amber-300 italic">(${it.notes})</span>` : ''}</div>`).join('')}
                      </td>
                      <td class="p-4 font-extrabold text-emerald-400">${formatRupiah(o.totalAmount)}</td>
                      <td class="p-4">
                        <select onchange="updateOrderStatus('${o.id}', this.value)" class="bg-slate-900 border border-slate-700 px-2 py-1 rounded-full text-[10px] font-bold ${o.status === 'Selesai' ? 'text-emerald-400 border-emerald-500/40' : 'text-amber-300 border-amber-500/40'}">
                          <option value="Baru" ${o.status === 'Baru' ? 'selected' : ''}>🔴 Baru</option>
                          <option value="Diproses" ${o.status === 'Diproses' ? 'selected' : ''}>🟡 Diproses</option>
                          <option value="Siap" ${o.status === 'Siap' ? 'selected' : ''}>🔵 Siap Saji</option>
                          <option value="Selesai" ${o.status === 'Selesai' ? 'selected' : ''}>🟢 Selesai</option>
                        </select>
                      </td>
                      <td class="p-4 text-right space-x-2">
                        <button onclick="showKitchenBon('${o.id}')" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-[11px]">Bon Dapur</button>
                        <button onclick="generateInvoiceFromOrder('${o.id}')" class="px-3 py-1.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/30 font-bold text-[11px]">+ Generate Invoice</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function updateOrderStatus(orderId, newStatus) {
      const ord = state.orders.find(o => o.id === orderId);
      if (ord) {
        ord.status = newStatus;
        saveState();
        showToast('Status Order Diperbarui', `${orderId} diubah ke ${newStatus}`);
      }
    }

    // Direct Integration: Order -> Invoice -> Customer LTV
    function generateInvoiceFromOrder(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      
      const existing = state.invoices.find(i => i.orderId === orderId);
      if (existing) {
        switchTab('invoices');
        showToast('Invoice Sudah Terhubung', `Invoice ${existing.id} sudah diterbitkan untuk order ini.`);
        return;
      }

      const newInv = {
        id: `INV-${Date.now().toString().slice(-4)}`,
        orderId: order.id,
        customerId: order.customerId || 'c1',
        customerName: order.customerName,
        customerPhone: order.customerPhone,
        customerAddress: order.customerAddress,
        issueDate: new Date().toISOString().slice(0, 10),
        dueDate: new Date(Date.now() + 3 * 86400000).toISOString().slice(0, 10),
        totalAmount: order.totalAmount,
        paidAmount: 0,
        remainingAmount: order.totalAmount,
        status: 'Terkirim',
        paymentMethod: 'Transfer BCA',
        items: order.items.map(it => ({ name: it.name, qty: it.qty, price: it.price })),
        tax: order.tax,
        shippingFee: order.shippingFee
      };

      state.invoices.unshift(newInv);
      saveState();
      switchTab('invoices');
      showToast('Invoice Berhasil Di-Generate!', `Invoice ${newInv.id} sebesar ${formatRupiah(newInv.totalAmount)} terhubung ke data pelanggan ${order.customerName}.`);
    }

    function autoFillCustomer(custId) {
      if (!custId) return;
      const cust = state.customers.find(c => c.id === custId);
      if (cust) {
        document.getElementById('ord-cust-name').value = cust.name;
        document.getElementById('ord-cust-phone').value = cust.phone;
        document.getElementById('ord-cust-address').value = cust.address;
        showToast('Data Pelanggan Terisi', `Mengambil data ${cust.name} dari CRM.`);
      }
    }

    function calculateOrderTotal() {
      const itemVal = document.getElementById('ord-item-name').value.split('|');
      const unitPrice = Number(itemVal[1]);
      const qty = Math.max(1, parseInt(document.getElementById('ord-qty').value) || 1);
      const subtotal = unitPrice * qty;
      const tax = Math.round(subtotal * 0.1);
      const total = subtotal + tax;

      document.getElementById('calc-subtotal').innerText = formatRupiah(subtotal);
      document.getElementById('calc-tax').innerText = formatRupiah(tax);
      document.getElementById('calc-total').innerText = formatRupiah(total);
    }

    function submitNewOrder(e) {
      e.preventDefault();
      const custId = document.getElementById('ord-cust-select').value || `c${Date.now().toString().slice(-4)}`;
      const name = document.getElementById('ord-cust-name').value;
      const phone = document.getElementById('ord-cust-phone').value;
      const address = document.getElementById('ord-cust-address').value;
      const type = document.getElementById('ord-type').value;
      const itemVal = document.getElementById('ord-item-name').value.split('|');
      const itemName = itemVal[0];
      const price = Number(itemVal[1]);
      const qty = parseInt(document.getElementById('ord-qty').value) || 1;
      const notes = document.getElementById('ord-notes').value;

      const subtotal = price * qty;
      const tax = Math.round(subtotal * 0.1);
      const totalAmount = subtotal + tax;

      // Auto add to CRM if new customer
      const existingCust = state.customers.find(c => c.id === custId || c.phone === phone);
      if (!existingCust) {
        state.customers.unshift({ id: custId, name, phone, address, tag: 'Pelanggan Baru', lifetimeValue: totalAmount, totalOrders: 1 });
      } else {
        existingCust.lifetimeValue += totalAmount;
        existingCust.totalOrders += 1;
      }

      const newOrder = {
        id: `ORD-${Date.now().toString().slice(-4)}`,
        customerId: custId,
        customerName: name,
        customerPhone: phone,
        customerAddress: address,
        orderType: type,
        status: 'Diproses',
        items: [{ name: itemName, qty, price, notes }],
        subtotal, tax, shippingFee: 0, totalAmount, notes
      };

      state.orders.unshift(newOrder);
      saveState();
      closeModal();
      renderOrders(document.getElementById('main-content'));
      showToast('Order Terhubung CRM Tersimpan!', `Order ${newOrder.id} (${qty}x ${itemName}) dibuat untuk ${name}.`);
    }

            <div>• BCA: <b>123-456-7890</b> a.n. Resto Syukuran</div>
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-3 no-print">
          <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-xs font-bold text-slate-300 rounded-xl">Tutup</button>
          <button onclick="window.print()" class="px-4 py-2 bg-emerald-500 text-xs font-bold text-white rounded-xl">Cetak PDF</button>
        </div>
      `;
    }

    function openExpenseModal() {
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md';
      content.innerHTML = `
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
          <h3 class="text-base font-bold text-white">💸 Catat Pengeluaran Operasional</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
        </div>
        <form onsubmit="submitExpense(event)" class="space-y-4 pt-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Kategori</label>
            <select id="exp-cat" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none font-bold">
              <option value="Bahan Baku">Bahan Baku Pasar</option>
              <option value="Operasional">Gas LPG & Listrik</option>
              <option value="Gaji">Gaji Staf</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Deskripsi *</label>
            <input type="text" id="exp-desc" required placeholder="Belanja Ayam Pasar Senen" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Nominal (Rp) *</label>
            <input type="number" id="exp-amount" required placeholder="500000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 font-bold" />
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-rose-500 text-xs font-bold text-white shadow-lg shadow-rose-500/25">Simpan Pengeluaran</button>
          </div>
        </form>
      `;
    }

    function submitExpense(e) {
      e.preventDefault();
      const cat = document.getElementById('exp-cat').value;
      const desc = document.getElementById('exp-desc').value;
      const amount = Number(document.getElementById('exp-amount').value);

      const newExpense = {
        id: `EXP-${Date.now().toString().slice(-4)}`,
        date: new Date().toISOString().slice(0, 10),
        category: cat,
        description: desc,
        amount,
        receiptImage: null
      };

      state.expenses.unshift(newExpense);
      saveState();
      closeModal();
      renderFinance(document.getElementById('main-content'));
      showToast('Pengeluaran Dicatat', `Pengeluaran Rp ${amount.toLocaleString('id-ID')} tersimpan.`);
    }

    function openCameraModal() {
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md';
      content.innerHTML = `
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
          <h3 class="text-base font-bold text-white">📸 Live Absensi Foto Selfie</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
        </div>
        <div class="space-y-4 pt-4 text-center">
          <div class="w-full h-48 rounded-2xl bg-slate-950 border border-slate-800 flex flex-col items-center justify-center p-4">
            <img id="selfie-preview" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover rounded-xl" />
          </div>
          <div class="text-xs text-emerald-400 font-bold">GPS Radius Verifikasi: 28m dari Resto (Dalam Radius)</div>
          <button onclick="submitAttendance()" class="w-full py-2.5 rounded-xl bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-500/25">
            Kirim Absensi Check-in
          </button>
        </div>
      `;
    }

    function submitAttendance() {
      const newAtt = {
        id: `att-${Date.now()}`,
        name: 'Siti Aminah',
        role: 'Kasir & Admin',
        date: new Date().toISOString().slice(0, 10),
        checkInTime: new Date().toLocaleTimeString('id-ID'),
        status: 'Hadir Tepat Waktu',
        statusCode: 'H',
        photoUrl: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=200&q=80',
        distanceMeters: 28,
        isOutRadius: false
      };

      state.attendance.unshift(newAtt);
      saveState();
      closeModal();
      renderAttendance(document.getElementById('main-content'));
      showToast('Absensi Sukses!', 'Absensi foto selfie & GPS berhasil tersimpan.');
    }

    function openCustomerModal() {
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md';
      content.innerHTML = `
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
          <h3 class="text-base font-bold text-white">➕ Tambah Pelanggan Baru (CRM)</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
        </div>
        <form onsubmit="submitNewCustomer(event)" class="space-y-4 pt-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Nama Pelanggan *</label>
            <input type="text" id="cust-name" required placeholder="Bpk. Tirta Wijaya" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">No. WhatsApp *</label>
            <input type="text" id="cust-phone" required placeholder="081234567890" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 block mb-1">Alamat Lengkap</label>
            <input type="text" id="cust-address" placeholder="Jl. Gatot Subroto No. 12" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-500 text-xs font-bold text-white">Simpan ke CRM</button>
          </div>
        </form>
      `;
    }

    function submitNewCustomer(e) {
      e.preventDefault();
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;

      state.customers.unshift({
        id: `c${Date.now().toString().slice(-4)}`,
        name, phone, address, tag: 'Pelanggan Baru', lifetimeValue: 0, totalOrders: 0
      });
      saveState();
      closeModal();
      renderCRM(document.getElementById('main-content'));
      showToast('Pelanggan CRM Ditambahkan', `${name} terhubung ke database.`);
    }

    function closeModal() {
      document.getElementById('modal-container').className = 'hidden';
    }

    // Auto Sync Loop
    setInterval(() => {
      const remoteOrders = JSON.parse(localStorage.getItem('resto_linked_orders'));
      const remoteInvoices = JSON.parse(localStorage.getItem('resto_linked_invoices'));
      if (remoteOrders && JSON.stringify(remoteOrders) !== JSON.stringify(state.orders)) {
        state.orders = remoteOrders;
        renderCurrentTab();
      }
      if (remoteInvoices && JSON.stringify(remoteInvoices) !== JSON.stringify(state.invoices)) {
        state.invoices = remoteInvoices;
        renderCurrentTab();
      }
    }, 3000);

    // Initialize App on Load
    window.onload = function() {
      renderCurrentTab();
    };
  </script>
</body>
</html>
