<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RestoOS — Sistem Manajemen Rumah Makan Production Ready</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#f0fdf4',500:'#22c55e',600:'#16a34a',700:'#15803d'}}}}}</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    *{-webkit-tap-highlight-color:transparent}
    body{font-family:'Inter',sans-serif;background:#090d16;color:#f1f5f9}
    .glass{background:rgba(15,23,42,.75);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,.37)}
    .touch-btn{min-height:44px;min-width:44px}

      .desktop-sidebar{display:none!important}

  </style>
</head>
<body class="min-h-screen selection:bg-emerald-500 selection:text-white">

<!-- LOGIN SCREEN -->
<div id="login-screen" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6">
  <div class="w-full max-w-sm space-y-6 text-center">
    <div class="w-16 h-16 mx-auto rounded-3xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-3xl shadow-2xl shadow-emerald-500/30">🍱</div>
    <h1 class="text-2xl font-black text-white">RestoOS BI Platform</h1>
    <p class="text-xs text-slate-400">Sistem Manajemen Rumah Makan & Business Intelligence</p>
    <form onsubmit="handleLogin(event)" class="space-y-3 text-left">
      <div>
        <label class="text-[11px] font-bold text-slate-400 block mb-1">Nama Staf / Email</label>
        <input type="text" id="login-name" required placeholder="Contoh: Budi Santoso" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 touch-btn">
      </div>
      <div>
        <label class="text-[11px] font-bold text-slate-400 block mb-1">Role / Jabatan</label>
        <select id="login-role" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 touch-btn font-bold">
          <option value="owner">👑 Owner / Pemilik</option>
          <option value="manager">🛡️ Manajer / Supervisor</option>
          <option value="admin">📝 Admin Input</option>
          <option value="karyawan">👤 Karyawan (Absensi Saja)</option>
        </select>
      </div>
      <button type="submit" class="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm shadow-xl shadow-emerald-500/30 touch-btn">Masuk ke Sistem</button>
    </form>
    <p class="text-[10px] text-slate-600">v2.0 Production Ready — Data tersimpan permanen di browser</p>
  </div>
</div>

<!-- HEADER -->
<header id="app-header" class="hidden sticky top-0 z-40 w-full border-b border-slate-800 bg-slate-950/90 backdrop-blur-xl px-4 py-3 flex items-center justify-between gap-3">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-lg shadow-lg shadow-emerald-500/20">🍱</div>
    <div>
      <span class="font-extrabold text-sm text-white">RestoOS</span>
      <span class="text-[9px] font-bold ml-1.5 px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">PRODUCTION</span>
      <div class="text-[10px] text-slate-500" id="logged-in-as"></div>
    </div>
  </div>
  <button onclick="handleLogout()" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-[11px] font-bold text-slate-400 hover:text-rose-400 touch-btn">Logout</button>
</header>

<!-- MAIN LAYOUT -->
<div class="flex flex-col md:flex-row min-h-[calc(100vh-52px)]">
  <!-- Desktop Sidebar -->
  <aside class="desktop-sidebar w-60 bg-slate-950/80 border-r border-slate-800 p-3 space-y-1.5 shrink-0">
    <div class="text-[9px] font-bold uppercase tracking-wider text-slate-600 px-3 mb-2">Modul</div>
    <div id="sidebar-nav"></div>
  </aside>

  <!-- Main Content -->
  <main id="main-content" class="main-area flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full overflow-x-hidden"></main>
</div>

<!-- Mobile Bottom Nav -->
<nav class="mobile-bottom-nav fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-xl border-t border-slate-800 px-2 py-1.5 flex justify-around items-center" id="mobile-nav"></nav>

<!-- Toast -->
<div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 left-4 md:left-auto md:right-6 z-50 pointer-events-none"></div>

<!-- Modal -->
<div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 bg-slate-950/80 backdrop-blur-md">
  <div id="modal-content" class="relative w-full max-w-lg rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl max-h-[90vh] overflow-y-auto p-5"></div>
</div>

<script>
// ====== CONFIGURATION ======
const DEFAULTS = { restoName:'Resto Syukuran Nusantara', restoAddress:'Jl. Senopati No. 88, Jakarta', bankInfo:'BCA 123-456-7890 a.n. Resto Syukuran', restoLat:-6.2088, restoLon:106.8456, geoRadius:100 };
let webcamStream = null, searchQ = '', filterSt = 'All';

// ====== STATE with localStorage persistence ======
function loadState() {
  return {
    loggedIn: JSON.parse(localStorage.getItem('ro_logged')) || null,
    config: JSON.parse(localStorage.getItem('ro_config')) || {...DEFAULTS},
    menu: JSON.parse(localStorage.getItem('ro_menu')) || [
      {id:'m1',name:'Nasi Tumpeng Mini Komplit',price:45000,cat:'Catering'},
      {id:'m2',name:'Ayam Goreng Kremes + Nasi',price:32000,cat:'Main'},
      {id:'m3',name:'Bebek Bakar Madu Spesial',price:48000,cat:'Main'},
      {id:'m4',name:'Es Teh Manis Jumbo',price:7000,cat:'Beverage'},
      {id:'m5',name:'Es Jeruk Peras Alami',price:10000,cat:'Beverage'},
      {id:'m6',name:'Paket Prasmanan 50 Porsi',price:2500000,cat:'Catering'}
    ],
    customers: JSON.parse(localStorage.getItem('ro_cust')) || [
      {id:'c1',name:'Bpk. Hendra Wijaya',phone:'081234567890',address:'Jl. Sudirman No. 45, Jakarta',tag:'VIP',ltv:12500000,orders:8},
      {id:'c2',name:'Ibu Ratna Pertiwi',phone:'081987654321',address:'Wisma Asri Lt. 4, Kebayoran',tag:'Catering Regular',ltv:8400000,orders:4},
      {id:'c3',name:'PT Sinergi Mandiri',phone:'085678901234',address:'Pulogadung Blok C-12',tag:'Corporate',ltv:24500000,orders:6},
      {id:'c4',name:'Sdri. Maya Indah',phone:'087811223344',address:'Apt Rasuna Tower 3',tag:'Baru',ltv:350000,orders:1}
    ],
    orders: JSON.parse(localStorage.getItem('ro_ord')) || [
      {id:'ORD-001',custId:'c1',custName:'Bpk. Hendra Wijaya',custPhone:'081234567890',custAddr:'Jl. Sudirman No. 45',type:'Catering',status:'Diproses',date:'2026-08-05',items:[{name:'Nasi Tumpeng Mini',qty:25,price:45000,notes:'Pedas sedang'},{name:'Es Jeruk Peras',qty:25,price:10000,notes:'Es dipisah'}],subtotal:1375000,tax:137500,ship:50000,total:1562500},
      {id:'ORD-002',custId:'c4',custName:'Sdri. Maya Indah',custPhone:'087811223344',custAddr:'Apt Rasuna Tower 3',type:'Pre-order',status:'Selesai',date:'2026-08-05',items:[{name:'Ayam Goreng Kremes',qty:10,price:32000,notes:''},{name:'Es Teh Manis',qty:10,price:7000,notes:''}],subtotal:390000,tax:39000,ship:0,total:429000}
    ],
    invoices: JSON.parse(localStorage.getItem('ro_inv')) || [
      {id:'INV-001',orderId:'ORD-001',custId:'c1',custName:'Bpk. Hendra Wijaya',custPhone:'081234567890',custAddr:'Jl. Sudirman No. 45',issueDate:'2026-08-05',dueDate:'2026-08-08',total:1562500,paid:500000,remaining:1062500,status:'Sebagian Dibayar',method:'Transfer BCA',items:[{name:'Nasi Tumpeng Mini',qty:25,price:45000},{name:'Es Jeruk Peras',qty:25,price:10000}],tax:137500,ship:50000},
      {id:'INV-004',orderId:'ORD-008',custId:'c3',custName:'PT Sinergi Mandiri',custPhone:'085678901234',custAddr:'Pulogadung',issueDate:'2026-08-01',dueDate:'2026-08-04',total:5650000,paid:0,remaining:5650000,status:'Jatuh Tempo',method:'Transfer Mandiri',items:[{name:'Paket Prasmanan 50 Porsi',qty:2,price:2500000}],tax:500000,ship:150000}
    ],
    expenses: JSON.parse(localStorage.getItem('ro_exp')) || [
      {id:'EXP-1',date:'2026-08-05',cat:'Bahan Baku',desc:'Belanja Pasar: Ayam & Daging',amount:1450000},
      {id:'EXP-2',date:'2026-08-04',cat:'Operasional',desc:'Gas LPG 12kg (3 tabung)',amount:630000}
    ],
    attendance: JSON.parse(localStorage.getItem('ro_att')) || [
      {id:'a1',name:'Budi Santoso',role:'Koki Utama',date:'2026-08-05',time:'07:45',status:'Hadir',photo:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=200',dist:24},
      {id:'a2',name:'Siti Aminah',role:'Kasir',date:'2026-08-05',time:'08:18',status:'Terlambat',photo:'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=200',dist:65}
    ],
    esbSales: JSON.parse(localStorage.getItem('ro_esb')) || 3250000,
    tab: 'dashboard'
  };
}
let S = loadState();

function save() {
  localStorage.setItem('ro_config',JSON.stringify(S.config));
  localStorage.setItem('ro_menu',JSON.stringify(S.menu));
  localStorage.setItem('ro_cust',JSON.stringify(S.customers));
  localStorage.setItem('ro_ord',JSON.stringify(S.orders));
  localStorage.setItem('ro_inv',JSON.stringify(S.invoices));
  localStorage.setItem('ro_exp',JSON.stringify(S.expenses));
  localStorage.setItem('ro_att',JSON.stringify(S.attendance));
  localStorage.setItem('ro_esb',S.esbSales);
  localStorage.setItem('ro_logged',JSON.stringify(S.loggedIn));
}

// ====== HELPERS ======
const rp = n => n ? new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n) : 'Rp 0';
const waLink = (ph,txt) => { let p=ph.replace(/\D/g,''); if(p.startsWith('0'))p='62'+p.slice(1); return `https://wa.me/${p}?text=${encodeURIComponent(txt)}`; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);
const daysDiff = (d) => Math.round((new Date(d)-new Date(today()))/(864e5));

function toast(t,m) {
  const c=document.getElementById('toast-container'), d=document.createElement('div');
  d.className='p-3 rounded-2xl bg-slate-900 border border-emerald-500 text-emerald-300 text-xs font-bold shadow-2xl mb-2 pointer-events-auto';
  d.innerHTML=`<div>${t}</div><div class="text-slate-400 font-normal mt-0.5">${m}</div>`;
  c.appendChild(d); setTimeout(()=>d.remove(),3500);
}

function haversine(lat1,lon1,lat2,lon2) {
  const R=6371e3,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

// ====== REMINDER ENGINE ======
function getReminders() {
  const r = [];
  S.invoices.forEach(inv => {
    if(inv.remaining <= 0) return;
    const dd = daysDiff(inv.dueDate);
    if(dd <= 3 && dd > 1) r.push({...inv, urgency:'reminder', label:`H-${dd} Jatuh Tempo`, color:'amber'});
    else if(dd === 1) r.push({...inv, urgency:'warning', label:'H-1 Besok Jatuh Tempo!', color:'orange'});
    else if(dd === 0) r.push({...inv, urgency:'critical', label:'HARI INI Jatuh Tempo!', color:'rose'});
    else if(dd < 0) r.push({...inv, urgency:'overdue', label:`OVERDUE H+${Math.abs(dd)}`, color:'rose'});
  });
  return r.sort((a,b)=> daysDiff(a.dueDate) - daysDiff(b.dueDate));
}

// ====== RICH WA INVOICE TEMPLATE ======
function buildWaInvoiceMsg(inv) {
  let items = inv.items.map(i=>`• ${i.qty}x ${i.name} = ${rp(i.qty*i.price)}`).join('\n');
  return `Halo ${inv.custName},\n\nBerikut tagihan invoice *${inv.id}*:\n${items}\n\nSubtotal: ${rp(inv.total-inv.tax-inv.ship)}\nPajak 10%: ${rp(inv.tax)}\n${inv.ship?'Ongkir: '+rp(inv.ship)+'\n':''}*Total: ${rp(inv.total)}*\n${inv.paid>0?'Sudah dibayar: '+rp(inv.paid)+'\n':''}${inv.remaining>0?'*Sisa tagihan: '+rp(inv.remaining)+'*\n':''}\nTransfer ke: ${S.config.bankInfo}\n\nTerima kasih! 🙏\n— ${S.config.restoName}`;
}

// ====== PAYMENT SYNC (Single Source of Truth) ======
function recordPayment(invId, amount) {
  const inv = S.invoices.find(i=>i.id===invId);
  if(!inv) return;
  inv.paid += amount;
  inv.remaining = Math.max(0, inv.total - inv.paid);
  inv.status = inv.remaining <= 0 ? 'Lunas' : 'Sebagian Dibayar';
  // Sync to order
  const ord = S.orders.find(o=>o.id===inv.orderId);
  if(ord && inv.remaining<=0) ord.status = 'Selesai';
  // Sync to CRM LTV
  const cust = S.customers.find(c=>c.id===inv.custId);
  if(cust) cust.ltv += amount;
  save();
  toast('Pembayaran Tercatat!', `${rp(amount)} untuk ${inv.id} — ${inv.status}`);
}

// ====== AUTH ======
function handleLogin(e) {
  e.preventDefault();
  const name = document.getElementById('login-name').value;
  const role = document.getElementById('login-role').value;
  S.loggedIn = {name, role, time: new Date().toLocaleString('id-ID')};
  save();
  showApp();
}
function handleLogout() {
  S.loggedIn = null;
  localStorage.removeItem('ro_logged');
  document.getElementById('login-screen').className = 'fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6';
  document.getElementById('app-header').className = 'hidden';
  document.querySelector('.flex.flex-col.md\\:flex-row').className = 'hidden flex-col md:flex-row min-h-[calc(100vh-52px)]';
  document.getElementById('mobile-nav').className = 'mobile-bottom-nav hidden';
}

function showApp() {
  document.getElementById('login-screen').className = 'hidden';
  document.getElementById('app-header').className = 'sticky top-0 z-40 w-full border-b border-slate-800 bg-slate-950/90 backdrop-blur-xl px-4 py-3 flex items-center justify-between gap-3';
  document.querySelector('.flex.flex-col.md\\:flex-row').className = 'flex flex-col md:flex-row min-h-[calc(100vh-52px)]';
  document.getElementById('logged-in-as').textContent = `${S.loggedIn.name} (${S.loggedIn.role})`;

  const isKaryawan = S.loggedIn.role === 'karyawan';
  const tabs = isKaryawan
    ? [{id:'attendance',icon:'📸',label:'Absensi'}]
    : [
      {id:'dashboard',icon:'📊',label:'Dashboard BI'},
      {id:'orders',icon:'🛒',label:'Order Catering'},
      {id:'invoices',icon:'📄',label:'Invoice'},
      {id:'finance',icon:'💰',label:'Keuangan'},
      {id:'crm',icon:'🔔',label:'CRM'},
      {id:'attendance',icon:'📸',label:'Absensi'},
      {id:'menu',icon:'🍲',label:'Menu'},
      {id:'settings',icon:'⚙️',label:'Setting'}
    ];

  // Desktop sidebar
  document.getElementById('sidebar-nav').innerHTML = tabs.map(t=>`
    <button onclick="go('${t.id}')" id="sn-${t.id}" class="sn w-full text-left p-2.5 rounded-xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900 touch-btn">${t.icon} ${t.label}</button>
  `).join('');

  // Mobile bottom nav
  document.getElementById('mobile-nav').innerHTML = tabs.slice(0, 5).map(t=>`
    <button onclick="go('${t.id}')" id="mn-${t.id}" class="mn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-500 touch-btn">
      <span class="text-lg">${t.icon}</span><span class="text-[9px] font-bold">${t.label.split(' ')[0]}</span>
    </button>
  `).join('') + (tabs.length > 5 ? `
    <button onclick="document.getElementById('more-menu').classList.toggle('hidden')" class="mn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-slate-500 touch-btn relative">
      <span class="text-lg">☰</span><span class="text-[9px] font-bold">Lagi</span>
      <div id="more-menu" class="hidden absolute bottom-full mb-2 right-0 bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-2xl min-w-[140px]">
        ${tabs.slice(5).map(t=>`<button onclick="go('${t.id}');document.getElementById('more-menu').classList.add('hidden')" class="w-full text-left p-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 touch-btn">${t.icon} ${t.label}</button>`).join('')}
      </div>
    </button>
  ` : '');

  if(isKaryawan) S.tab = 'attendance';
  go(S.tab || 'dashboard');
}

function go(tab) {
  S.tab = tab;
  document.querySelectorAll('.sn').forEach(b=>b.className='sn w-full text-left p-2.5 rounded-xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900 touch-btn');
  document.querySelectorAll('.mn').forEach(b=>{b.classList.remove('text-emerald-400');b.classList.add('text-slate-500')});
  const sn=document.getElementById(`sn-${tab}`);
  if(sn) sn.className='sn w-full text-left p-2.5 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 touch-btn';
  const mn=document.getElementById(`mn-${tab}`);
  if(mn){mn.classList.remove('text-slate-500');mn.classList.add('text-emerald-400')}
  render();
}

function render() {
  const c = document.getElementById('main-content');
  if(S.tab==='dashboard') vDashboard(c);
  else if(S.tab==='orders') vOrders(c);
  else if(S.tab==='invoices') vInvoices(c);
  else if(S.tab==='finance') vFinance(c);
  else if(S.tab==='crm') vCRM(c);
  else if(S.tab==='attendance') vAttendance(c);
  else if(S.tab==='menu') vMenu(c);
  else if(S.tab==='settings') vSettings(c);
}

// ====== VIEWS ======
function vDashboard(c) {
  const reminders = getReminders();
  const activeOrds = S.orders.filter(o=>o.status!=='Selesai').length;
  const unpaid = S.invoices.reduce((s,i)=>s+i.remaining,0);

  c.innerHTML = `
    <div class="space-y-5">
      ${reminders.length ? `
      <div class="p-4 rounded-2xl bg-rose-950/50 border border-rose-500/40 space-y-2">
        <h3 class="text-sm font-bold text-rose-300">🔔 ${reminders.length} Invoice Perlu Penagihan Segera!</h3>
        ${reminders.map(r=>`
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-xl bg-slate-900/80 border border-${r.color}-500/30">
            <div>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-${r.color}-500/20 text-${r.color}-400">${r.label}</span>
              <span class="text-xs font-bold text-white ml-2">${r.id}</span>
              <span class="text-xs text-slate-400 ml-1">— ${r.custName}</span>
              <div class="text-xs font-extrabold text-${r.color}-400 mt-0.5">Sisa: ${rp(r.remaining)}</div>
            </div>
            <a href="${waLink(r.custPhone,buildWaInvoiceMsg(r))}" target="_blank" class="px-3 py-2 rounded-xl bg-emerald-600 text-white text-[11px] font-bold text-center touch-btn shadow-lg">Tagih via WA</a>
          </div>
        `).join('')}
      </div>` : ''}

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="p-4 rounded-2xl glass"><div class="text-[10px] text-slate-400 font-bold">Omset ESB POS</div><div class="text-xl font-black text-white mt-1">${rp(S.esbSales)}</div></div>
        <div class="p-4 rounded-2xl glass"><div class="text-[10px] text-slate-400 font-bold">Order Aktif</div><div class="text-xl font-black text-cyan-300 mt-1">${activeOrds}</div></div>
        <div class="p-4 rounded-2xl glass"><div class="text-[10px] text-slate-400 font-bold">Piutang</div><div class="text-xl font-black text-rose-300 mt-1">${rp(unpaid)}</div></div>
        <div class="p-4 rounded-2xl glass"><div class="text-[10px] text-slate-400 font-bold">Staf Hadir</div><div class="text-xl font-black text-white mt-1">${S.attendance.filter(a=>a.date===today()).length}</div></div>
      </div>

      <div class="p-5 rounded-2xl glass">
        <h3 class="text-sm font-bold text-white mb-3">Tren Penjualan Mingguan</h3>
        <canvas id="chart1" class="max-h-52"></canvas>
      </div>
    </div>`;
  setTimeout(()=>{const x=document.getElementById('chart1');if(x)new Chart(x,{type:'bar',data:{labels:['Sen','Sel','Rab','Kam','Jum','Sab','Min'],datasets:[{label:'Omset (Rp)',data:[2400000,3100000,2800000,4200000,5800000,8400000,7200000],backgroundColor:'#10b981',borderRadius:8}]},options:{responsive:true,plugins:{legend:{labels:{color:'#94a3b8'}}},scales:{x:{ticks:{color:'#64748b'}},y:{ticks:{color:'#64748b'}}}}})},100);
}

function vOrders(c) {
  const list = S.orders.filter(o=>(o.id+o.custName).toLowerCase().includes(searchQ.toLowerCase())&&(filterSt==='All'||o.status===filterSt));
  c.innerHTML = `
    <div class="space-y-4">

function fillCust(id) {
  const c=S.customers.find(x=>x.id===id);
  if(c){document.getElementById('o-nm').value=c.name;document.getElementById('o-ph').value=c.phone;document.getElementById('o-ad').value=c.address;toast('CRM Terisi',c.name)}
}

function calcOrder() {
  const v=document.getElementById('o-mn').value.split('|'),p=Number(v[1]),q=Math.max(1,parseInt(document.getElementById('o-qt').value)||1),sub=p*q,tax=Math.round(sub*.1);
  document.getElementById('c-sub').textContent=rp(sub);document.getElementById('c-tax').textContent=rp(tax);document.getElementById('c-tot').textContent=rp(sub+tax);
}

function submitOrder(e) {
  e.preventDefault();
  const cid=document.getElementById('o-cs').value||'c'+uid(),nm=document.getElementById('o-nm').value,ph=document.getElementById('o-ph').value,ad=document.getElementById('o-ad').value,tp=document.getElementById('o-tp').value;
  const v=document.getElementById('o-mn').value.split('|'),mn=v[0],pr=Number(v[1]),qt=parseInt(document.getElementById('o-qt').value)||1,nt=document.getElementById('o-nt').value;
  const sub=pr*qt,tax=Math.round(sub*.1),tot=sub+tax;
  const ec=S.customers.find(c=>c.id===cid||c.phone===ph);
  if(!ec) S.customers.unshift({id:cid,name:nm,phone:ph,address:ad,tag:'Baru',ltv:tot,orders:1});
  else{ec.ltv+=tot;ec.orders++}
  S.orders.unshift({id:'ORD-'+uid(),custId:cid,custName:nm,custPhone:ph,custAddr:ad,type:tp,status:'Diproses',date:today(),items:[{name:mn,qty:qt,price:pr,notes:nt}],subtotal:sub,tax,ship:0,total:tot});
  save();closeModal();go('orders');toast('Order Tersimpan!',`${qt}x ${mn} untuk ${nm}`);
}

function genInvoice(oid) {
  const o=S.orders.find(x=>x.id===oid);if(!o)return;
  if(S.invoices.find(i=>i.orderId===oid)){go('invoices');toast('Sudah Ada','Invoice sudah diterbitkan');return}
  const inv={id:'INV-'+uid(),orderId:o.id,custId:o.custId,custName:o.custName,custPhone:o.custPhone,custAddr:o.custAddr,issueDate:today(),dueDate:new Date(Date.now()+3*864e5).toISOString().slice(0,10),total:o.total,paid:0,remaining:o.total,status:'Terkirim',method:'Transfer BCA',items:o.items.map(i=>({name:i.name,qty:i.qty,price:i.price})),tax:o.tax,ship:o.ship};
  S.invoices.unshift(inv);save();go('invoices');toast('Invoice Diterbitkan!',`${inv.id} — ${rp(inv.total)}`);
}

// ====== CAMERA MODULE (Dual Mode: WebRTC + Native) ======
let capturedPhoto = null, currentDist = 0;

function mCamera() {
  capturedPhoto = null; currentDist = 0;
  openModal(`
    <div class="flex justify-between items-center pb-3 border-b border-slate-800"><h3 class="text-sm font-bold text-white">📸 Absensi Check-in</h3><button onclick="closeModal()" class="text-slate-400 text-lg touch-btn">✕</button></div>
    <div class="space-y-3 pt-3">
      <div><label class="text-[10px] text-slate-400 font-bold">Nama Staf</label><input type="text" id="cam-name" value="${S.loggedIn?S.loggedIn.name:''}" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-white font-bold touch-btn"></div>
      <div><label class="text-[10px] text-slate-400 font-bold">Role</label><input type="text" id="cam-role" value="${S.loggedIn?S.loggedIn.role:'Staf'}" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-white touch-btn"></div>

      <div class="relative w-full h-48 rounded-xl bg-slate-950 border-2 border-emerald-500/50 overflow-hidden">
        <video id="cam-vid" autoplay playsinline muted class="w-full h-full object-cover scale-x-[-1]"></video>
        <img id="cam-img" class="hidden absolute inset-0 w-full h-full object-cover">
      </div>

      <div id="gps-box" class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-center font-bold text-slate-400">📍 Memuat GPS...</div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="startCam()" class="py-2.5 rounded-xl bg-emerald-600 text-white text-[11px] font-bold touch-btn">⚡ Live Stream</button>
        <label class="py-2.5 rounded-xl bg-slate-800 text-slate-200 text-[11px] font-bold touch-btn text-center cursor-pointer border border-slate-700">
          📱 Kamera HP
          <input type="file" accept="image/*" capture="user" onchange="nativeCam(event)" class="hidden">
        </label>
      </div>
      <button id="snap-btn" onclick="snapPhoto()" class="hidden w-full py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold touch-btn">📸 Tangkap Foto</button>

      <div id="gps-warn" class="hidden p-3 rounded-xl bg-rose-950/50 border border-rose-500/40 text-xs text-rose-300 font-bold">❌ DI LUAR RADIUS RESTO! Absensi tidak bisa dikirim.</div>

      <button id="submit-att-btn" onclick="submitAtt()" class="w-full py-3 rounded-xl bg-emerald-500 text-white font-bold text-sm touch-btn shadow-lg disabled:opacity-50" disabled>Kirim Absensi</button>
    </div>
  `);
  setTimeout(getGPS,100);
}

async function startCam() {
  try {
    const v=document.getElementById('cam-vid');
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    webcamStream=stream; v.srcObject=stream; v.play();
    v.className='w-full h-full object-cover scale-x-[-1]';
    document.getElementById('cam-img').className='hidden';
    document.getElementById('snap-btn').className='w-full py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold touch-btn';
    toast('Kamera Aktif','Stream kamera depan berhasil dimulai');
  } catch(e) { toast('Info','Gunakan tombol "📱 Kamera HP" jika izin kamera ditolak'); }
}

function snapPhoto() {
  const v=document.getElementById('cam-vid');
  if(!v||!v.videoWidth)return;
  const canvas=document.createElement('canvas');canvas.width=v.videoWidth;canvas.height=v.videoHeight;
  canvas.getContext('2d').drawImage(v,0,0);
  capturedPhoto=canvas.toDataURL('image/jpeg',0.7);
  document.getElementById('cam-img').src=capturedPhoto;
  document.getElementById('cam-img').className='absolute inset-0 w-full h-full object-cover';
  v.className='hidden';
  checkSubmitReady();
  toast('Foto Diambil!','Snapshot berhasil');
}

function nativeCam(e) {
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=function(ev){
    capturedPhoto=ev.target.result;
    document.getElementById('cam-img').src=capturedPhoto;
    document.getElementById('cam-img').className='absolute inset-0 w-full h-full object-cover';
    document.getElementById('cam-vid').className='hidden';
    checkSubmitReady();
    toast('Foto HP Berhasil!','Kamera smartphone terhubung');
  };
  r.readAsDataURL(f);
}

function getGPS() {
  const box=document.getElementById('gps-box');
  if(!navigator.geolocation){box.textContent='📍 GPS tidak tersedia';return}
  navigator.geolocation.getCurrentPosition(pos=>{
    currentDist=haversine(S.config.restoLat,S.config.restoLon,pos.coords.latitude,pos.coords.longitude);
    const ok=currentDist<=S.config.geoRadius;
    box.className=`p-2.5 rounded-xl border text-xs text-center font-bold ${ok?'bg-emerald-950/30 border-emerald-500/30 text-emerald-400':'bg-rose-950/30 border-rose-500/30 text-rose-400'}`;
    box.textContent=`📍 ${currentDist}m dari Resto ${ok?'✅ Dalam Radius':'❌ DI LUAR RADIUS!'}`;
    if(!ok) document.getElementById('gps-warn').className='p-3 rounded-xl bg-rose-950/50 border border-rose-500/40 text-xs text-rose-300 font-bold';
    else document.getElementById('gps-warn').className='hidden';
    checkSubmitReady();
  },()=>{
    currentDist=0; box.textContent='📍 Izin lokasi ditolak — GPS tidak aktif';
    checkSubmitReady();
  },{enableHighAccuracy:true,timeout:10000});
}

function checkSubmitReady() {
  const btn=document.getElementById('submit-att-btn');
  const hasPhoto=!!capturedPhoto;
  const gpsOk=currentDist<=S.config.geoRadius||currentDist===0;
  btn.disabled=!(hasPhoto&&gpsOk);
}

function submitAtt() {
  if(!capturedPhoto)return;
  const nm=document.getElementById('cam-name').value||S.loggedIn.name;
  const rl=document.getElementById('cam-role').value||S.loggedIn.role;
  S.attendance.unshift({id:'a'+uid(),name:nm,role:rl,date:today(),time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),status:new Date().getHours()<8?'Hadir':'Terlambat',photo:capturedPhoto,dist:currentDist});
  save();closeModal();go('attendance');toast('Absensi Sukses!','Foto selfie + GPS terverifikasi');
}

function exportCSV() {
  let csv="No Invoice,Pelanggan,Total,Dibayar,Sisa,Status\n"+S.invoices.map(i=>`${i.id},"${i.custName}",${i.total},${i.paid},${i.remaining},${i.status}`).join("\n");
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURI(csv);a.download=`Laporan_RestoOS_${today()}.csv`;document.body.appendChild(a);a.click();a.remove();
}

    S.orders=fresh.orders;S.invoices=fresh.invoices;S.customers=fresh.customers;S.expenses=fresh.expenses;S.attendance=fresh.attendance;
    render();
  }
},3000);
</script>
