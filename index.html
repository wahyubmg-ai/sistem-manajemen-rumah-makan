let webcamStream=null, searchQ='', filterSt='All';

      {id:'m6',name:'Paket Prasmanan 50 Porsi',price:2500000,cat:'Catering'}
    ],
    customers: JSON.parse(localStorage.getItem('ro_cust'))||[
      {id:'c1',name:'Bpk. Hendra Wijaya',phone:'081234567890',address:'Jl. Sudirman No. 45, Jakarta',tag:'VIP',ltv:12500000,orders:8},

    ],

      {id:'ORD-2026-0001',custId:'c1',custName:'Bpk. Hendra Wijaya',custPhone:'081234567890',custAddr:'Jl. Sudirman No. 45',type:'Catering',status:'Diproses',date:'2026-08-05',items:[{name:'Nasi Tumpeng Mini',qty:25,price:45000,notes:'Pedas sedang'},{name:'Es Jeruk Peras',qty:25,price:10000,notes:'Es dipisah'}],subtotal:1375000,tax:137500,ship:50000,total:1562500},
      {id:'ORD-2026-0002',custId:'c4',custName:'Sdri. Maya Indah',custPhone:'087811223344',custAddr:'Apt Rasuna Tower 3',type:'Pre-order',status:'Selesai',date:'2026-08-05',items:[{name:'Ayam Goreng Kremes',qty:10,price:32000,notes:''},{name:'Es Teh Manis',qty:10,price:7000,notes:''}],subtotal:390000,tax:39000,ship:0,total:429000}

      {id:'INV-2026-0002',orderId:'ORD-2026-0003',custId:'c3',custName:'PT Sinergi Mandiri',custPhone:'085678901234',custAddr:'Pulogadung',issueDate:'2026-08-01',dueDate:'2026-08-04',total:5650000,paid:0,remaining:5650000,status:'Jatuh Tempo',method:'Transfer Mandiri',items:[{name:'Paket Prasmanan 50 Porsi',qty:2,price:2500000}],tax:500000,ship:150000}

    ],

let S = loadState();

function save(){
  localStorage.setItem('ro_config',JSON.stringify(S.config));
  localStorage.setItem('ro_menu',JSON.stringify(S.menu));
  localStorage.setItem('ro_cust',JSON.stringify(S.customers));
  localStorage.setItem('ro_ord',JSON.stringify(S.orders));
  localStorage.setItem('ro_inv',JSON.stringify(S.invoices));
  localStorage.setItem('ro_exp',JSON.stringify(S.expenses));
  localStorage.setItem('ro_att',JSON.stringify(S.attendance));
  localStorage.setItem('ro_esb',JSON.stringify(S.esbSales));
  localStorage.setItem('ro_logged',JSON.stringify(S.loggedIn));
  localStorage.setItem('ro_ctr',JSON.stringify(S.counters));
}

// ===================== HELPERS =====================
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const waLink=(ph,txt)=>{let p=ph.replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);return`https://wa.me/${p}?text=${encodeURIComponent(txt)}`};
const today=()=>new Date().toISOString().slice(0,10);
const daysDiff=d=>Math.round((new Date(d)-new Date(today()))/864e5);
const yr=()=>new Date().getFullYear();

// Sequential ID generator: ORD-2026-0003, INV-2026-0004, etc.
function nextId(prefix){
  const key = prefix.toLowerCase().replace('-','');
  S.counters[key] = (S.counters[key]||0)+1;
  save();
  return `${prefix}-${yr()}-${String(S.counters[key]).padStart(4,'0')}`;
}

function toast(t,m){
  const c=document.getElementById('toast-container'),d=document.createElement('div');
  d.className='p-3 rounded-2xl bg-slate-900 border border-emerald-500 text-emerald-300 text-xs font-bold shadow-2xl mb-2 pointer-events-auto animate-pulse';
  d.innerHTML=`<div>${t}</div><div class="text-slate-400 font-normal mt-0.5">${m}</div>`;
  c.appendChild(d);setTimeout(()=>d.remove(),4000);
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371e3,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

// ===================== REMINDER ENGINE =====================
function getReminders(){
  const r=[];
  S.invoices.forEach(inv=>{
    if(inv.remaining<=0)return;
    const dd=daysDiff(inv.dueDate);
    if(dd<=3&&dd>1)r.push({...inv,label:`H-${dd} Jatuh Tempo`,color:'amber'});
    else if(dd===1)r.push({...inv,label:'H-1 Besok Jatuh Tempo!',color:'orange'});
    else if(dd===0)r.push({...inv,label:'HARI INI Jatuh Tempo!',color:'rose'});
    else if(dd<0)r.push({...inv,label:`OVERDUE ${Math.abs(dd)} hari`,color:'rose'});
  });
  return r.sort((a,b)=>daysDiff(a.dueDate)-daysDiff(b.dueDate));
}

// ===================== WA INVOICE MSG =====================
function buildWaMsg(inv){
  const items=inv.items.map(i=>`• ${i.qty}x ${i.name} = ${rp(i.qty*i.price)}`).join('\n');
  return `Halo ${inv.custName},\n\nBerikut tagihan invoice *${inv.id}*:\n${items}\n\nSubtotal: ${rp(inv.total-inv.tax-(inv.ship||0))}\nPajak 10%: ${rp(inv.tax)}\n${inv.ship?'Ongkir: '+rp(inv.ship)+'\n':''}*Total: ${rp(inv.total)}*\n${inv.paid>0?'Sudah dibayar: '+rp(inv.paid)+'\n':''}${inv.remaining>0?'*Sisa: '+rp(inv.remaining)+'*\n':''}\nTransfer ke: ${S.config.bankInfo}\n\nTerima kasih! 🙏\n— ${S.config.restoName}`;
}

// ===================== PAYMENT SYNC =====================
function recordPayment(invId,amount){
  const inv=S.invoices.find(i=>i.id===invId);if(!inv||amount<=0)return;
  inv.paid+=amount;
  inv.remaining=Math.max(0,inv.total-inv.paid);
  inv.status=inv.remaining<=0?'Lunas':'Sebagian Dibayar';
  // Sync order
  const ord=S.orders.find(o=>o.id===inv.orderId);
  if(ord&&inv.remaining<=0)ord.status='Selesai';
  // Sync CRM
  const cust=S.customers.find(c=>c.id===inv.custId);
  if(cust)cust.ltv+=amount;
  save();toast('💰 Pembayaran Tercatat',`${rp(amount)} untuk ${inv.id} → ${inv.status}`);
}

// ===================== AUTH WITH PASSWORD =====================
function handleLogin(e){
  e.preventDefault();
  const u=document.getElementById('login-user').value.trim().toLowerCase();
  const p=document.getElementById('login-pass').value;
  const staff=loadStaff();
  const found=staff.find(s=>s.username.toLowerCase()===u&&s.password===p&&s.active);
  const errBox=document.getElementById('login-err');
  if(!found){
    errBox.className='p-2 rounded-xl bg-rose-950 border border-rose-500/40 text-[11px] text-rose-300 font-bold text-center';
    errBox.textContent='❌ Username atau password salah!';
    return;
  }
  S.loggedIn={id:found.id,username:found.username,name:found.fullName,role:found.role,time:new Date().toLocaleString('id-ID')};
  save();showApp();
}

function handleLogout(){
  if(webcamStream){webcamStream.getTracks().forEach(t=>t.stop());webcamStream=null;}
  S.loggedIn=null;localStorage.removeItem('ro_logged');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-header').classList.add('hidden');
  document.getElementById('app-layout').classList.add('hidden');
  document.getElementById('app-layout').classList.remove('flex');
}

// ===================== SHOW APP =====================

  const role=S.loggedIn.role;
  let tabs=[];

    tabs=[{id:'attendance',icon:'📸',label:'Absensi'}];
  } else if(role==='admin'){
    tabs=[
      {id:'dashboard',icon:'📊',label:'Dashboard'},
      {id:'orders',icon:'🛒',label:'Order'},
      {id:'invoices',icon:'📄',label:'Invoice'},
      {id:'crm',icon:'👥',label:'CRM'},
      {id:'attendance',icon:'📸',label:'Absensi'}
    ];
  } else {
    tabs=[
      {id:'dashboard',icon:'📊',label:'Dashboard'},
      {id:'orders',icon:'🛒',label:'Order'},
      {id:'invoices',icon:'📄',label:'Invoice'},
      {id:'finance',icon:'💰',label:'Keuangan'},
      {id:'crm',icon:'👥',label:'CRM'},
      {id:'attendance',icon:'📸',label:'Absensi'},
      {id:'menu',icon:'🍲',label:'Menu'},
      {id:'staff',icon:'👤',label:'Pegawai'},
      {id:'settings',icon:'⚙️',label:'Setting'}
    ];
    if(role==='manager'){tabs=tabs.filter(t=>t.id!=='settings')}
  }

  // Desktop sidebar
  document.getElementById('sidebar-nav').innerHTML=tabs.map(t=>`
    <button onclick="go('${t.id}')" id="sn-${t.id}" class="sn w-full text-left p-2.5 rounded-xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900 touch-btn">${t.icon} ${t.label}</button>
  `).join('');

  // Mobile bottom nav (max 5 + more)
  const mainTabs=tabs.slice(0,5);
  const moreTabs=tabs.slice(5);
  document.getElementById('mobile-nav').innerHTML=mainTabs.map(t=>`
    <button onclick="go('${t.id}')" id="mn-${t.id}" class="mn flex flex-col items-center gap-0.5 px-1.5 py-1 rounded-xl text-slate-500 touch-btn">
      <span class="text-base">${t.icon}</span><span class="text-[8px] font-bold">${t.label}</span>
    </button>
  `).join('')+(moreTabs.length?`
    <div class="relative">
      <button onclick="document.getElementById('more-dd').classList.toggle('hidden')" class="mn flex flex-col items-center gap-0.5 px-1.5 py-1 rounded-xl text-slate-500 touch-btn">
        <span class="text-base">☰</span><span class="text-[8px] font-bold">Lagi</span>
      </button>
      <div id="more-dd" class="hidden absolute bottom-full mb-2 right-0 bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-2xl min-w-[130px]">
        ${moreTabs.map(t=>`<button onclick="go('${t.id}');document.getElementById('more-dd').classList.add('hidden')" class="w-full text-left p-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 touch-btn">${t.icon} ${t.label}</button>`).join('')}
      </div>
    </div>
  `:'');

  if(role==='karyawan')S.tab='attendance';
  go(S.tab||'dashboard');
}

function go(tab){
  S.tab=tab;
  document.querySelectorAll('.sn').forEach(b=>{b.className='sn w-full text-left p-2.5 rounded-xl text-xs font-bold transition-all text-slate-400 hover:bg-slate-900 touch-btn'});
  document.querySelectorAll('.mn').forEach(b=>{b.classList.remove('text-emerald-400');b.classList.add('text-slate-500')});
  const sn=document.getElementById(`sn-${tab}`);
  if(sn)sn.className='sn w-full text-left p-2.5 rounded-xl text-xs font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 touch-btn';
  const mn=document.getElementById(`mn-${tab}`);
  if(mn){mn.classList.remove('text-slate-500');mn.classList.add('text-emerald-400')}
  render();
}

function render(){
  const c=document.getElementById('main-content');
  const views={dashboard:vDashboard,orders:vOrders,invoices:vInvoices,finance:vFinance,crm:vCRM,attendance:vAttendance,menu:vMenu,staff:vStaff,settings:vSettings};
  if(views[S.tab])views[S.tab](c);
}

function updateOrderStatus(oid,st){
  const o=S.orders.find(x=>x.id===oid);if(!o)return;
  o.status=st;
  // If completed, sync CRM
  if(st==='Selesai'){
    const cu=S.customers.find(c=>c.id===o.custId);
    if(cu){/* already tracked via invoice payment */}
  }
  save();render();
  toast('Status Updated',`${oid} → ${st}`);
}

function genInvoice(oid){
  const o=S.orders.find(x=>x.id===oid);if(!o)return;
  if(S.invoices.find(i=>i.orderId===oid)){toast('Sudah Ada','Invoice sudah diterbitkan untuk order ini');go('invoices');return}
  const invId=nextId('INV');
  const inv={id:invId,orderId:o.id,custId:o.custId,custName:o.custName,custPhone:o.custPhone,custAddr:o.custAddr,issueDate:today(),dueDate:new Date(Date.now()+3*864e5).toISOString().slice(0,10),total:o.total,paid:0,remaining:o.total,status:'Terkirim',method:'Transfer',items:o.items.map(i=>({name:i.name,qty:i.qty,price:i.price})),tax:o.tax,ship:o.ship||0};
  S.invoices.unshift(inv);save();go('invoices');
  toast('📄 Invoice Diterbitkan!',`${invId} — ${rp(inv.total)} untuk ${o.custName}`);
}

function detectMyGPS(){
  const box=document.getElementById('gps-detect-result');
  box.className='p-2 rounded-xl bg-slate-950 text-[11px] text-cyan-300 text-center';
  box.textContent='⏳ Mendeteksi lokasi GPS...';
  if(!navigator.geolocation){box.textContent='❌ GPS tidak tersedia di browser ini';box.classList.add('text-rose-400');return}
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById('s-lat').value=pos.coords.latitude.toFixed(6);
    document.getElementById('s-lon').value=pos.coords.longitude.toFixed(6);
    box.innerHTML=`✅ Lokasi terdeteksi: <b>${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}</b> (akurasi ${Math.round(pos.coords.accuracy)}m). Klik Simpan!`;
    toast('📍 GPS Aktif!','Koordinat terisi otomatis');
  },err=>{
    const msgs={1:'❌ Izin lokasi ditolak. Buka Settings browser → izinkan Location.',2:'❌ Posisi tidak tersedia.',3:'❌ Timeout. Coba lagi.'};
    box.textContent=msgs[err.code]||'❌ Gagal mendapatkan GPS';
    box.className='p-2 rounded-xl bg-rose-950 text-[11px] text-rose-300 text-center';
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function saveSettings(){
  S.config.restoName=document.getElementById('s-name').value;
  S.config.restoAddress=document.getElementById('s-addr').value;
  S.config.bankInfo=document.getElementById('s-bank').value;
  S.config.restoLat=parseFloat(document.getElementById('s-lat').value)||DEFAULTS.restoLat;
  S.config.restoLon=parseFloat(document.getElementById('s-lon').value)||DEFAULTS.restoLon;
  S.config.geoRadius=parseInt(document.getElementById('s-rad').value)||DEFAULTS.geoRadius;
  S.esbSales=Number(document.getElementById('s-esb').value)||0;
  save();toast('✅ Tersimpan!','Pengaturan berhasil diperbarui');
}

let orderItemCount=0;
function addOrderItem(){
  orderItemCount++;
  const menuOpts=S.menu.map(m=>`<option value="${m.id}">${m.name} — ${rp(m.price)}</option>`).join('');
  const div=document.createElement('div');
  div.className='p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2';
  div.id=`oi-${orderItemCount}`;
  div.innerHTML=`
    <div class="flex justify-between items-center"><span class="text-[10px] font-bold text-slate-400">Item #${orderItemCount}</span><button type="button" onclick="document.getElementById('oi-${orderItemCount}').remove();calcOrderTotal()" class="text-[10px] text-rose-400 font-bold touch-btn">✕ Hapus</button></div>
    <select onchange="calcOrderTotal()" class="oi-menu inp touch-btn text-[11px]">${menuOpts}</select>
    <div class="grid grid-cols-2 gap-2">
      <div><label class="text-[10px] text-slate-500">Qty Porsi</label><input type="number" min="1" value="1" oninput="calcOrderTotal()" class="oi-qty inp touch-btn font-bold"></div>
      <div><label class="text-[10px] text-slate-500">Catatan</label><input type="text" placeholder="Pedas, dll" class="oi-note inp touch-btn"></div>
    </div>`;
  document.getElementById('order-items-list').appendChild(div);
  calcOrderTotal();
}

function calcOrderTotal(){
  let sub=0;
  document.querySelectorAll('#order-items-list > div').forEach(row=>{
    const menuId=row.querySelector('.oi-menu').value;
    const mi=S.menu.find(m=>m.id===menuId);
    const qty=parseInt(row.querySelector('.oi-qty').value)||1;
    if(mi)sub+=mi.price*qty;
  });
  const tax=Math.round(sub*0.1);
  document.getElementById('c-sub').textContent=rp(sub);
  document.getElementById('c-tax').textContent=rp(tax);
  document.getElementById('c-tot').textContent=rp(sub+tax);
}

function fillCust(id){
  const c=S.customers.find(x=>x.id===id);
  if(c){
    document.getElementById('o-nm').value=c.name;
    document.getElementById('o-ph').value=c.phone;
    document.getElementById('o-ad').value=c.address||'';
    toast('👥 CRM Terisi',`Data ${c.name} otomatis diisi`);
  } else {
    document.getElementById('o-nm').value='';
    document.getElementById('o-ph').value='';
    document.getElementById('o-ad').value='';
  }
}

function submitOrder(e){
  e.preventDefault();
  const csVal=document.getElementById('o-cs').value;
  const nm=document.getElementById('o-nm').value.trim();
  const ph=document.getElementById('o-ph').value.trim();
  const ad=document.getElementById('o-ad').value.trim();
  const tp=document.getElementById('o-tp').value;

  // Collect items
  const items=[];
  document.querySelectorAll('#order-items-list > div').forEach(row=>{
    const menuId=row.querySelector('.oi-menu').value;
    const mi=S.menu.find(m=>m.id===menuId);
    const qty=parseInt(row.querySelector('.oi-qty').value)||1;
    const note=row.querySelector('.oi-note').value.trim();
    if(mi)items.push({name:mi.name,qty,price:mi.price,notes:note});
  });
  if(items.length===0){toast('⚠️ Error','Tambahkan minimal 1 item menu');return}

  const sub=items.reduce((s,i)=>s+i.price*i.qty,0);
  const tax=Math.round(sub*0.1);
  const total=sub+tax;

  // CRM SYNC: find or create customer
  let custId=csVal;
  let existCust=csVal?S.customers.find(c=>c.id===csVal):S.customers.find(c=>c.phone===ph);
  if(existCust){
    custId=existCust.id;
    existCust.orders=(existCust.orders||0)+1;
    // Update name/address if changed
    if(nm)existCust.name=nm;
    if(ad)existCust.address=ad;
  } else {
    custId='c'+Date.now();
    S.customers.unshift({id:custId,name:nm,phone:ph,address:ad,tag:'Baru',ltv:0,orders:1});
  }

  const orderId=nextId('ORD');
  S.orders.unshift({id:orderId,custId,custName:nm,custPhone:ph,custAddr:ad,type:tp,status:'Baru',date:today(),items,subtotal:sub,tax,ship:0,total});
  save();closeModal();go('orders');
  toast('✅ Order Tersimpan!',`${orderId} — ${items.length} item untuk ${nm}`);
}

function submitMenu(e){
  e.preventDefault();
  S.menu.unshift({id:'m'+Date.now(),name:document.getElementById('mn-nm').value.trim(),price:Number(document.getElementById('mn-pr').value),cat:document.getElementById('mn-ct').value});
  save();closeModal();go('menu');toast('✅ Tersimpan','Menu baru tersedia di form order');
}

// --- STAFF ADD/EDIT ---
function mAddStaff(){
  openModal(`
    <div class="flex justify-between items-center pb-3 border-b border-slate-800"><h3 class="text-sm font-bold text-white">👤 Tambah Pegawai</h3><button onclick="closeModal()" class="text-slate-400 text-lg touch-btn">✕</button></div>
    <form onsubmit="submitStaff(event)" class="space-y-3 pt-3">
      <div><label class="text-[10px] text-slate-400 font-bold">Nama Lengkap *</label><input type="text" id="st-nm" required class="inp touch-btn"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[10px] text-slate-400 font-bold">Username Login *</label><input type="text" id="st-un" required placeholder="huruf kecil tanpa spasi" class="inp touch-btn"></div>
        <div><label class="text-[10px] text-slate-400 font-bold">Password *</label><input type="text" id="st-pw" required value="1234" class="inp touch-btn"></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[10px] text-slate-400 font-bold">Role / Jabatan</label><select id="st-rl" class="inp touch-btn"><option value="karyawan">👤 Karyawan</option><option value="admin">📝 Admin</option><option value="manager">🛡️ Manager</option><option value="owner">👑 Owner</option></select></div>
        <div><label class="text-[10px] text-slate-400 font-bold">No HP</label><input type="text" id="st-ph" class="inp touch-btn"></div>
      </div>
      <div class="flex gap-2 pt-2"><button type="button" onclick="closeModal()" class="flex-1 btn-s touch-btn">Batal</button><button type="submit" class="flex-1 btn-p touch-btn">💾 Simpan</button></div>
    </form>
  `);
}
function submitStaff(e){
  e.preventDefault();
  const staff=loadStaff();
  const un=document.getElementById('st-un').value.trim().toLowerCase();
  if(staff.find(s=>s.username===un)){toast('⚠️ Gagal','Username sudah dipakai!');return}
  staff.push({id:'s'+Date.now(),username:un,password:document.getElementById('st-pw').value,fullName:document.getElementById('st-nm').value.trim(),role:document.getElementById('st-rl').value,phone:document.getElementById('st-ph').value.trim(),active:true});
  saveStaff(staff);closeModal();go('staff');toast('✅ Pegawai Ditambahkan',un);
}

function mEditStaff(sid){
  const staff=loadStaff();
  const s=staff.find(x=>x.id===sid);if(!s)return;
  openModal(`
    <div class="flex justify-between items-center pb-3 border-b border-slate-800"><h3 class="text-sm font-bold text-white">✏️ Edit Pegawai</h3><button onclick="closeModal()" class="text-slate-400 text-lg touch-btn">✕</button></div>
    <form onsubmit="updateStaff(event,'${sid}')" class="space-y-3 pt-3">
      <div><label class="text-[10px] text-slate-400 font-bold">Nama Lengkap</label><input type="text" id="st-nm" value="${s.fullName}" required class="inp touch-btn"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[10px] text-slate-400 font-bold">Username</label><input type="text" id="st-un" value="${s.username}" required class="inp touch-btn"></div>
        <div><label class="text-[10px] text-slate-400 font-bold">Password Baru</label><input type="text" id="st-pw" value="${s.password}" required class="inp touch-btn"></div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[10px] text-slate-400 font-bold">Role</label><select id="st-rl" class="inp touch-btn">
          ${['karyawan','admin','manager','owner'].map(r=>`<option value="${r}" ${s.role===r?'selected':''}>${r}</option>`).join('')}
        </select></div>
        <div><label class="text-[10px] text-slate-400 font-bold">No HP</label><input type="text" id="st-ph" value="${s.phone||''}" class="inp touch-btn"></div>
      </div>
      <div class="flex gap-2 pt-2"><button type="button" onclick="closeModal()" class="flex-1 btn-s touch-btn">Batal</button><button type="submit" class="flex-1 btn-p touch-btn">💾 Simpan</button></div>
    </form>
  `);
}
function updateStaff(e,sid){
  e.preventDefault();
  const staff=loadStaff();
  const s=staff.find(x=>x.id===sid);if(!s)return;
  s.fullName=document.getElementById('st-nm').value.trim();
  s.username=document.getElementById('st-un').value.trim().toLowerCase();
  s.password=document.getElementById('st-pw').value;
  s.role=document.getElementById('st-rl').value;
  s.phone=document.getElementById('st-ph').value.trim();
  saveStaff(staff);closeModal();go('staff');toast('✅ Diperbarui',s.fullName);
}

// ===================== CAMERA + GPS MODULE =====================
let capturedPhoto=null, currentDist=null, currentLat=null, currentLon=null;

function mCamera(){
  capturedPhoto=null;currentDist=null;currentLat=null;currentLon=null;
  openModal(`
    <div class="flex justify-between items-center pb-3 border-b border-slate-800"><h3 class="text-sm font-bold text-white">📸 Check-in Absensi</h3><button onclick="closeModal()" class="text-slate-400 text-lg touch-btn">✕</button></div>
    <div class="space-y-3 pt-3">
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-[10px] text-slate-400 font-bold">Nama</label><input type="text" id="cam-name" value="${S.loggedIn?S.loggedIn.name:''}" readonly class="inp touch-btn bg-slate-800 font-bold"></div>
        <div><label class="text-[10px] text-slate-400 font-bold">Role</label><input type="text" id="cam-role" value="${S.loggedIn?S.loggedIn.role:''}" readonly class="inp touch-btn bg-slate-800"></div>
      </div>

      <div class="relative w-full h-48 rounded-2xl bg-slate-950 border-2 border-dashed border-slate-700 overflow-hidden flex items-center justify-center">
        <video id="cam-vid" autoplay playsinline muted class="hidden w-full h-full object-cover" style="transform:scaleX(-1)"></video>
        <img id="cam-img" class="hidden absolute inset-0 w-full h-full object-cover">
        <div id="cam-placeholder" class="text-center text-slate-500"><div class="text-3xl mb-1">📸</div><div class="text-[10px] font-bold">Ambil foto dengan tombol di bawah</div></div>
      </div>

      <div id="gps-box" class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-center">
        <div class="font-bold text-slate-400">📍 Memuat GPS...</div>
        <div class="text-[10px] text-slate-500 mt-1">Pastikan lokasi / GPS di HP aktif</div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="startCam()" class="py-2.5 rounded-xl bg-emerald-600 text-white text-[11px] font-bold touch-btn">⚡ Webcam Live</button>
        <label class="py-2.5 rounded-xl bg-slate-800 text-slate-200 text-[11px] font-bold touch-btn text-center cursor-pointer border border-slate-700 flex items-center justify-center gap-1">
          📱 Kamera HP
          <input type="file" accept="image/*" capture="user" onchange="nativeCam(event)" class="hidden">
        </label>
      </div>
      <button id="snap-btn" onclick="snapPhoto()" class="hidden w-full py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold touch-btn">📸 Snap Foto!</button>

      <div id="gps-warn" class="hidden p-3 rounded-xl bg-rose-950/50 border border-rose-500/40 text-xs text-rose-300 font-bold text-center"></div>

      <button id="submit-att-btn" onclick="submitAtt()" class="w-full py-3 rounded-xl bg-emerald-500 text-white font-bold text-sm touch-btn shadow-lg disabled:opacity-40 disabled:cursor-not-allowed" disabled>📤 Kirim Absensi</button>
      <div id="att-status" class="text-[10px] text-center text-slate-500"></div>
    </div>
  `);
  // AUTO-activate GPS immediately
  setTimeout(activateGPS,200);
}

function activateGPS(){
  const box=document.getElementById('gps-box');
  const warn=document.getElementById('gps-warn');
  const status=document.getElementById('att-status');

  if(!navigator.geolocation){
    box.innerHTML='<div class="font-bold text-rose-400">❌ GPS tidak tersedia di browser ini</div>';
    status.textContent='GPS tidak tersedia. Absensi tanpa validasi lokasi.';
    currentDist=0; // allow without GPS
    checkAttReady();
    return;
  }

  box.innerHTML='<div class="font-bold text-amber-400">⏳ Mendeteksi lokasi GPS...</div><div class="text-[10px] text-slate-500 mt-1">Tunggu beberapa detik...</div>';

  navigator.geolocation.getCurrentPosition(
    pos=>{
      currentLat=pos.coords.latitude;
      currentLon=pos.coords.longitude;
      currentDist=haversine(S.config.restoLat,S.config.restoLon,currentLat,currentLon);
      const inRadius=currentDist<=S.config.geoRadius;

      box.innerHTML=`
        <div class="font-bold ${inRadius?'text-emerald-400':'text-rose-400'}">${inRadius?'✅':'❌'} ${currentDist}m dari resto ${inRadius?'— Dalam Radius':'— DI LUAR RADIUS!'}</div>
        <div class="text-[10px] text-slate-500 mt-1">Koordinat: ${currentLat.toFixed(5)}, ${currentLon.toFixed(5)} · Akurasi: ${Math.round(pos.coords.accuracy)}m</div>
      `;
      box.className=`p-3 rounded-xl border text-xs text-center ${inRadius?'bg-emerald-950/30 border-emerald-500/30':'bg-rose-950/30 border-rose-500/30'}`;

      if(!inRadius){
        warn.className='p-3 rounded-xl bg-rose-950/50 border border-rose-500/40 text-xs text-rose-300 font-bold text-center';
        warn.textContent=`❌ Anda ${currentDist}m dari resto. Radius absensi: ${S.config.geoRadius}m. Absensi ditolak!`;
      } else {
        warn.className='hidden';
      }
      checkAttReady();
      status.textContent=inRadius?'GPS OK — siap kirim absensi':'GPS OK — tapi di luar radius';
    },
    err=>{
      const msgs={1:'Izin lokasi ditolak. Buka Settings browser → izinkan.',2:'Posisi tidak tersedia.',3:'Timeout — coba lagi.'};
      box.innerHTML=`<div class="font-bold text-rose-400">❌ ${msgs[err.code]||'Gagal GPS'}</div>`;
      box.className='p-3 rounded-xl bg-rose-950/30 border border-rose-500/30 text-xs text-center';
      currentDist=null;
      status.textContent='GPS gagal. Coba reload halaman atau aktifkan GPS di HP.';
      checkAttReady();
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

async function startCam(){
  try{
    const v=document.getElementById('cam-vid');
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    webcamStream=stream;v.srcObject=stream;v.play();
    v.className='w-full h-full object-cover';v.style.transform='scaleX(-1)';
    document.getElementById('cam-img').className='hidden';
    document.getElementById('cam-placeholder').className='hidden';
    document.getElementById('snap-btn').className='w-full py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold touch-btn';
    toast('📸 Kamera Aktif','Stream berhasil dimulai');
  }catch(e){toast('ℹ️ Info','Gunakan tombol "📱 Kamera HP" jika webcam tidak tersedia')}
}

function snapPhoto(){
  const v=document.getElementById('cam-vid');if(!v||!v.videoWidth)return;
  const canvas=document.createElement('canvas');canvas.width=v.videoWidth;canvas.height=v.videoHeight;
  const ctx=canvas.getContext('2d');ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(v,0,0);
  capturedPhoto=canvas.toDataURL('image/jpeg',0.7);
  document.getElementById('cam-img').src=capturedPhoto;
  document.getElementById('cam-img').className='absolute inset-0 w-full h-full object-cover';
  v.className='hidden';
  document.getElementById('cam-placeholder').className='hidden';
  document.getElementById('snap-btn').className='hidden';
  if(webcamStream){webcamStream.getTracks().forEach(t=>t.stop());webcamStream=null;}
  checkAttReady();toast('📸 Foto Diambil!','');
}

function nativeCam(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(ev){
    capturedPhoto=ev.target.result;
    document.getElementById('cam-img').src=capturedPhoto;
    document.getElementById('cam-img').className='absolute inset-0 w-full h-full object-cover';
    document.getElementById('cam-vid').className='hidden';
    document.getElementById('cam-placeholder').className='hidden';
    checkAttReady();toast('📸 Foto HP Berhasil!','');
  };r.readAsDataURL(f);
}

function checkAttReady(){
  const btn=document.getElementById('submit-att-btn');if(!btn)return;
  const hasPhoto=!!capturedPhoto;
  const gpsOk=currentDist!==null&&currentDist<=S.config.geoRadius;
  const gpsUnavail=currentDist===0; // GPS unavailable fallback
  btn.disabled=!(hasPhoto&&(gpsOk||gpsUnavail));
}

function submitAtt(){
  if(!capturedPhoto)return;
  const nm=S.loggedIn.name;
  const rl=S.loggedIn.role;
  const now=new Date();
  const timeStr=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  const isLate=now.getHours()>=9||(now.getHours()===8&&now.getMinutes()>30);

  S.attendance.unshift({id:'a'+Date.now(),staffId:S.loggedIn.id,name:nm,role:rl,date:today(),time:timeStr,status:isLate?'Terlambat':'Hadir',photo:capturedPhoto,dist:currentDist||0,lat:currentLat,lon:currentLon});
  save();closeModal();go('attendance');
  toast('✅ Absensi Berhasil!',`${nm} · ${timeStr} WIB · ${currentDist||0}m`);
}

// ===================== CSV EXPORT =====================
function exportCSV(){
  let csv='No,Invoice,Order,Pelanggan,Phone,Total,Dibayar,Sisa,Status,Terbit,Jatuh Tempo\n';
  S.invoices.forEach((i,n)=>{csv+=`${n+1},${i.id},${i.orderId},"${i.custName}",${i.custPhone},${i.total},${i.paid},${i.remaining},${i.status},${i.issueDate},${i.dueDate}\n`});
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download=`Laporan_RestoOS_${today()}.csv`;document.body.appendChild(a);a.click();a.remove();
  toast('📥 CSV Terunduh','Buka file di Excel/Google Sheets');
}

  if(S.loggedIn){

    const staff=loadStaff();
    const valid=staff.find(s=>s.id===S.loggedIn.id&&s.active);
    if(valid)showApp();

  }
};
