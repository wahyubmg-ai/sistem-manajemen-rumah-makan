      if (num === undefined || num === null || isNaN(num)) return 'Rp 0';
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    };

    const formatDate = (dateStr) => {
      if (!dateStr) return '-';
      return new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    };

    const formatDateTime = (dateStr) => {
      if (!dateStr) return '-';
      return new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    };

    const getWhatsAppLink = (phone, text) => {
      if (!phone) return '#';
      let formatted = phone.replace(/\D/g, '');
      if (formatted.startsWith('0')) formatted = '62' + formatted.slice(1);
      return `https://wa.me/${formatted}?text=${encodeURIComponent(text)}`;

      useEffect(() => { localStorage.setItem('resto_standalone_invoices', JSON.stringify(invoices)); }, [invoices]);

      useEffect(() => { localStorage.setItem('resto_standalone_customers', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('resto_standalone_attendance', JSON.stringify(attendance)); }, [attendance]);
      useEffect(() => { localStorage.setItem('resto_standalone_reminders', JSON.stringify(reminders)); }, [reminders]);

      const showToast = (title, message, type = 'info') => {
        setToast({ title, message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Modals State
      const [isOrderModalOpen, setIsOrderModalOpen] = useState(false);
      const [receiptOrder, setReceiptOrder] = useState(null);
      const [activeInvoice, setActiveInvoice] = useState(null);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [isCameraOpen, setIsCameraOpen] = useState(false);
      const [cameraPhoto, setCameraPhoto] = useState(null);

      // Render Active Tab Content
      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navbar */}

              </button>

                📄 Invoice & Billing ({invoices.length})
